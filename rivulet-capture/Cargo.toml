[package]
name = "rivulet-capture"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Screen and window capture for Rivulet"

[dependencies]
rivulet-core = { path = "../rivulet-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
xcap = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

# DXGI Desktop Duplication (G2) — Windows-only; same version already in the
# tree via windows-capture, so no version conflict in the lockfile.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

# PipeWire portal screen capture (G6) now lives in `rivulet-core`
# (`pipewire_capture`) so `PipeWireBackend` can drive it (F-M8-004); this crate
# re-exports it. ashpd/pipewire are therefore core's Linux dependencies, not
# this crate's — keeping them here as well would build the same crates twice
# for nothing.
