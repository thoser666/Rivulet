[package]
name = "rivulet-capture"
version.workspace = true
edition = "2021"
description = "Screen and window capture for Rivulet"

[dependencies]
rivulet-core = { path = "../rivulet-core" }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
xcap = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }

# DXGI Desktop Duplication (G2) — Windows-only; same version already in the
# tree via windows-capture, so no version conflict in the lockfile.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

# PipeWire portal screen capture (G6) — Linux-only.
# ashpd provides xdg-desktop-portal D-Bus bindings; pipewire captures frames.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.10", features = ["tokio", "screencast"] }
pipewire = { version = "0.10.0", features = ["v0_3_33"] }
futures-util = "0.3"
