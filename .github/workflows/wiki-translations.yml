name: Wiki translations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'scripts/check-wiki-translations.py'
      - 'scripts/sync-wiki-translations.py'
      - 'scripts/audit-wiki-links.py'

permissions:
  contents: read

jobs:
  sync-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: .freebuff-rivulet-wiki
          fetch-depth: 1
      - name: Validate language pairs
        run: python3 scripts/check-wiki-translations.py .freebuff-rivulet-wiki --locales de,es
      - name: Check wiki links and translation drift
        run: python3 scripts/sync-wiki-translations.py --check .freebuff-rivulet-wiki
      - name: Fetch develop for origin-referenced audits
        # PR checkouts are shallow refs/pull/N/merge without an origin/develop
        # ref, so `git show origin/develop:<file>` in --develop-from-origin
        # mode would fail for every repo-doc link. Fetch the branch ref
        # explicitly (scheduled runs on develop already have it).
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin develop
      - name: Audit wiki links (interwiki, repo-docs, external URLs, repo-doc wiki refs)
        run: python3 scripts/audit-wiki-links.py .freebuff-rivulet-wiki --develop-from-origin --check-repo-docs
      - name: Staleness report (repo docs mirrored in the wiki)
        run: python3 scripts/audit-wiki-links.py .freebuff-rivulet-wiki --develop-from-origin --skip-external --stale
      - name: User-guide topic report (derived vs. floor)
        # Informational: shows which required user-guide topics were
        # auto-derived from GUI i18n keys and which come from the explicit
        # REQUIRED_TOPICS floor. Coverage enforcement itself runs in CI
        # (check-user-guide-freshness.py without --report-topics).
        run: python3 scripts/check-user-guide-freshness.py --report-topics
      - name: Publish synchronized wiki changes
        if: github.event_name == 'schedule' && github.repository_owner == 'thoser666' && env.WIKI_SYNC_TOKEN != ''
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          git -C .freebuff-rivulet-wiki remote set-url origin "https://x-access-token:${WIKI_SYNC_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          # --publish pushes, then fetches the remote and verifies the pushed
          # hash was applied (exit 1 on any discrepancy).
          python3 scripts/sync-wiki-translations.py --publish .freebuff-rivulet-wiki
