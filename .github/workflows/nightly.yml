name: Nightly

# Daily verification build. Runs independently of commits; merged
# Dependabot pull requests do not trigger it (additionally guarded by the
# actor guard below).

on:
  schedule:
    # Daily at 02:17 UTC
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ################################################################
  # STALE ACTION PIN DETECTION (daily, outside Dependabot's schedule)
  ################################################################
  check_stale_action_pins:
    name: Check for stale action pins
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned SHAs against upstream tags/branches
        run: |
          # Write a compact Markdown notification to the run's step summary so
          # stale pins are visible even when the job only "fails red", and
          # make newer-major gaps fatal too (--fail-on-major), not just
          # same-major updates. The comment mode still prints the summary;
          # the exit code turns major gaps into a failed job.
          set -o pipefail
          python3 scripts/check-action-pins.py --fail-on-major --comment | tee -a "$GITHUB_STEP_SUMMARY"

  ################################################################
  # LINTS & FORMATTING (runs only on Linux)
  ################################################################
  lints:
    name: Lints (Fmt & Clippy)
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install GStreamer dependencies for clippy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            libglib2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ################################################################
  # BUILD & TEST MATRIX (runs on all 3 platforms)
  ################################################################
  build_and_test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install Linux dependencies (if applicable)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libdbus-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            libglib2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev

      - name: Install Windows dependencies (if applicable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install msys2 --params "/NoUpdate /InstallDir:C:/msys64"
          C:/msys64/usr/bin/bash -lc "pacman -S --noconfirm mingw-w64-x86_64-pkg-config"
          echo "C:/msys64/mingw64/bin" >> $env:GITHUB_PATH
          # Shared helper: MSI pair (<= 1.26) or unified Inno .exe (>= 1.28),
          # cache/mirror/fallback download with SHA256 verification.
          pwsh packaging/windows/install-gstreamer.ps1 -Version "1.26.11"

      - name: Verify GStreamer plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gst-inspect-1.0.exe --version
          Write-Host "GST_PLUGIN_PATH=$env:GST_PLUGIN_PATH"
          Write-Host "GST_PLUGIN_SYSTEM_PATH=$env:GST_PLUGIN_SYSTEM_PATH"
          Write-Host "GST_PLUGIN_SCANNER=$env:GST_PLUGIN_SCANNER"
          foreach ($p in @("gstx264.dll","gstlibav.dll","gstcoreelements.dll","gstflv.dll")) {
            $candidate = Join-Path $env:GST_PLUGIN_PATH $p
            Write-Host "$p exists -> $(Test-Path $candidate)"
          }
          foreach ($el in @("appsrc","videoconvert","x264enc","flvmux","rtmp2sink","mp4mux","avenc_aac","filesink","tee","queue")) {
            $out = gst-inspect-1.0.exe $el 2>&1 | Out-String
            Write-Host "$el -> $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) {
              Write-Host $out
            }
          }

      - name: Install macOS dependencies (if applicable)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose
