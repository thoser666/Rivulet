name: Dependabot auto-merge

# Enables auto-merge for Dependabot PRs so dependency bumps are merged
# automatically once the required CI checks are green. GitHub Actions tokens
# are intentionally not used to approve PRs: GitHub blocks bot approvals for
# this token class. The pinning tests (rivulet-core/tests/ci_pinning.rs) run
# inside ci.yml; branch protection remains the final merge gate.
#
# Prerequisites (repo settings, not committable):
#   - Settings -> General -> Pull Requests -> "Allow auto-merge" enabled.
#   - Branch protection on `develop` requiring the `Build & Test` checks.
#     `gh pr merge --auto` refuses to enable auto-merge without at least one
#     required status check.

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Approve and enable auto-merge
    runs-on: ubuntu-latest
    # Only for Dependabot PRs; pull_request_target runs in the base-repo
    # context, so never checkout or execute anything from the PR itself.
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Enable auto-merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
