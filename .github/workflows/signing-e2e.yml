name: Signing E2E

# Smoke-tests the release code-signing automation with self-signed
# certificates, so the signing scripts are verified on every push even before
# the real (secret) certificates are configured. No secrets required.

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows signing (self-signed)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test code signing with Pester
        shell: pwsh
        run: Invoke-Pester packaging/windows/sign.tests.ps1 -Output Detailed

  macos:
    name: macOS codesign (self-signed)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke-test codesign
        shell: bash
        run: bash packaging/macos/test-signing.sh
