name: Signing E2E

# Smoke-tests the release code-signing automation with self-signed
# certificates, so the signing scripts are verified on every push even before
# the real (secret) certificates are configured. No secrets required.

on:
  push:
    # Same rule as ci.yml: a push to a branch that already has an open pull
    # request is covered by the `pull_request` event, so an all-branch push
    # trigger ran this smoke test a second time for every branch push. Keep
    # the refs that never get a `pull_request` run.
    branches: [ develop, master, "release/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same ref supersedes the older one instead of queueing a
# second smoke test behind it. Only pull-request runs are cancelled: pushes to
# develop and manual dispatches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows signing (self-signed)
    runs-on: windows-latest
    # A hung step previously burned the full 6h job timeout on every run;
    # this keeps failures loud and fast.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test code signing with Pester
        shell: pwsh
        run: Invoke-Pester packaging/windows/sign-pester.tests.ps1 -Output Detailed

  macos:
    name: macOS codesign (self-signed)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke-test codesign
        shell: bash
        run: bash packaging/macos/test-signing.sh

  linux:
    name: Linux GPG signing (throwaway key)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke-test GPG signing
        shell: bash
        run: bash packaging/linux/test-gpg-signing.sh
