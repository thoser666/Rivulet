name: Release (Alpha)

# ALPHA-KANAL: Baut die Release-Binaries, sobald ein neues Feature
# (Conventional Commit "feat:..." / "feat(...):...") auf den develop-Branch
# gepusht wird. Jeder Feature-Push erzeugt ein versioniertes Alpha-Release
# (Tag vX.Y.Z-alpha.N) inkl. installierbarer Pakete (Portable/MSI, AppImage,
# DMG) und formellem GitHub-Release. Gemergte Dependabot-Pullrequests lösen
# den Build nicht aus.
#
# Für die höheren Reifegrade (Beta/RC/Stable) siehe den tag-basierten
# Release-Pfad in ci.yml ("refs/tags/v*").

on:
  push:
    branches: [ develop ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ################################################################
  # PRÜFUNG: Feature-Commit? (schließt Dependabot aus)
  ################################################################
  check:
    name: Check for feature push
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - name: Detect feature commit
        id: detect
        env:
          ACTOR: ${{ github.actor }}
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          SHOULD_RELEASE="false"

          # Gemergte Dependabot-PRs nie bauen (weder über den Actor noch über
          # den Autor der gepushten Commits).
          if [[ "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "dependabot-preview[bot]" ]]; then
            echo "Push stammt von Dependabot - Release-Build wird übersprungen."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$COMMITS" | jq -r '.[] | .author.name' | grep -q "dependabot"; then
            echo "Push enthält Dependabot-Commits - Release-Build wird übersprungen."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Feature-Erkennung: mindestens ein Commit muss nach der
          # Conventional-Commits-Konvention mit "feat" beginnen.
          if echo "$COMMITS" | jq -r '.[].message' | grep -qE '^feat(\(.*\))?:'; then
            SHOULD_RELEASE="true"
            echo "Feature-Commit gefunden - Release-Build wird ausgelöst."
          else
            echo "Kein Feature-Commit im Push - Release-Build wird übersprungen."
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  ################################################################
  # VERSIONIERUNG & TAGGING: bestimmt die nächste Version, bumped
  # Cargo.toml + CHANGELOG, committet beides und setzt den Alpha-Tag.
  ################################################################
  version:
    name: Determine version & tag
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version and tag
        id: bump
        run: |
          NEXT="$(bash scripts/release-version.sh)"
          # Nächste freie Alpha-Nummer für die Basisversion bestimmen.
          COUNT="$(git tag -l "v${NEXT}-alpha.*" | wc -l)"
          COUNT=$((COUNT + 1))
          VERSION="${NEXT}-alpha.${COUNT}"
          TAG="v${VERSION}"
          echo "Nächste Version: $VERSION (Tag: $TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Cargo.toml + CHANGELOG aktualisieren und committen.
          bash scripts/update-version.sh "$VERSION"
          bash scripts/update-changelog.sh "$VERSION"

          git add Cargo.toml rivulet-*/Cargo.toml CHANGELOG.md
          git commit -m "chore(release): prepare $TAG"
          git push origin develop

          # Tag setzen und pushen.
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Release-Tag $TAG gesetzt und gepusht."

  ################################################################
  # ALPHA BINARIES + PAKETE (nur bei Feature-Push)
  ################################################################
  build:
    name: Build Alpha Binaries (${{ matrix.artifact_name }})
    needs: [check, version]
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rivulet-linux-x86_64-alpha
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rivulet-windows-x86_64-alpha
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rivulet-macos-aarch64-alpha

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libdbus-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-tools libglib2.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Install Windows release dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install msys2 --params "/NoUpdate /InstallDir:C:/msys64"
          C:/msys64/usr/bin/bash -lc "pacman -S --noconfirm mingw-w64-x86_64-pkg-config"
          echo "C:/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = "1.24.13"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          $runtimeMsi = Join-Path $env:TEMP "gstreamer-runtime-$version.msi"
          $develMsi = Join-Path $env:TEMP "gstreamer-devel-$version.msi"
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $runtimeMsi
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$version.msi" -OutFile $develMsi
          Start-Process msiexec -ArgumentList "/i", "`"$runtimeMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          Start-Process msiexec -ArgumentList "/i", "`"$develMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          $gstRoot = [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
          if (-not $gstRoot) { $gstRoot = "C:\gstreamer\1.0\msvc_x86_64\" }
          $gstBin = Join-Path $gstRoot "bin"
          $pkgPath = Join-Path $gstRoot "lib\pkgconfig"
          $gstPlugins = Join-Path $gstRoot "lib\gstreamer-1.0"
          $gstScanner = Join-Path $gstRoot "libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          echo "PKG_CONFIG_PATH=$pkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SYSTEM_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SCANNER=$gstScanner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_REGISTRY=$env:TEMP\gst-registry.bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo $gstBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install macOS release dependencies
        if: runner.os == 'macOS'
        run: brew install gstreamer

      - name: Build release binary
        run: cargo build --release --package rivulet-gui --target ${{ matrix.target }}

      # ------------------------------------------------------------------
      # PACKAGING (pro Plattform)
      # ------------------------------------------------------------------
      - name: Stage binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/rivulet-gui staging/
          strip staging/rivulet-gui

      - name: Stage binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/rivulet-gui staging/
          strip staging/rivulet-gui

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rivulet-gui.exe" staging/rivulet-gui.exe -Force

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/linux/build-appimage.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-linux-x86_64.AppImage"

      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash packaging/macos/build-dmg.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-macos-aarch64.dmg"

      - name: Build portable ZIP + MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging/windows/build-portable.ps1 -Staging "$(pwd)/staging" -OutFile "$(pwd)/staging/rivulet-windows-x86_64-portable.zip"
          pwsh packaging/windows/build-msi.ps1 -Version "$env:RELEASE_VERSION" -Staging "$(pwd)/staging" -OutFile "$(pwd)/staging/rivulet-windows-x86_64.msi"

      # ------------------------------------------------------------------
      # CODE SIGNING (nur wenn die Secrets hinterlegt sind)
      # ------------------------------------------------------------------
      - name: Sign Windows binaries (if credentials configured)
        if: runner.os == 'Windows' && (env.WINDOWS_CERT_BASE64 != '' && env.WINDOWS_CERT_PASSWORD != '')
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          Get-ChildItem -Path staging -Include *.exe,*.dll -Recurse | ForEach-Object {
            & signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signierung fehlgeschlagen: $($_.Name)" }
          }

      - name: Sign macOS app (if credentials configured)
        if: runner.os == 'macOS' && (env.MACOS_CERT_BASE64 != '' && env.MACOS_CERT_PASSWORD != '' && env.APPLE_ID != '')
        shell: bash
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="release.keychain"
          echo "$MACOS_CERT_BASE64" | base64 -d > /tmp/cert.p12
          security create-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k temp "$KEYCHAIN"
          codesign --force --options runtime --sign "Developer ID Application" \
            --timestamp "staging/Rivulet.app"
          # DMG nach dem Signing bauen (Codesign vor hdiutil).
          bash packaging/macos/build-dmg.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-macos-aarch64.dmg"
          # Notarisierung + Stapelung.
          xcrun notarytool submit "staging/rivulet-macos-aarch64.dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "staging/rivulet-macos-aarch64.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            staging/rivulet-gui
            staging/rivulet-gui.exe
            staging/rivulet-linux-x86_64.AppImage
            staging/rivulet-macos-aarch64.dmg
            staging/rivulet-windows-x86_64-portable.zip
            staging/rivulet-windows-x86_64.msi

  ################################################################
  # FORMALES GITHUB RELEASE (Alpha)
  ################################################################
  github_release:
    name: Create Alpha GitHub Release
    needs: [check, version, build]
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Rivulet ${{ needs.version.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: true
          draft: false
