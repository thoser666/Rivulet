name: Release (Alpha)

# ALPHA CHANNEL: Builds release binaries as soon as a releasable Conventional
# Commit on develop has passed CI:
#
#   feat(...)   → minor bump   (e.g. 0.20 → 0.21)
#   fix(...)    → patch bump    (e.g. 0.20.0 → 0.20.1)
#   feat!(...)  → major bump    (e.g. 0.x → 1.0)
#
# The workflow is triggered by the CI workflow completing (workflow_run),
# NOT by the push itself. That is the gate: the release only starts once
# CI has concluded, and only when it concluded SUCCESS. A failed or
# cancelled CI run (e.g. a transient runner flake) skips the release here;
# rerunning CI green fires this workflow again automatically, so a flaky
# CI run never leaves a cancelled release behind and needs no manual
# release rerun.
#
# Every qualifying CI-green push produces a versioned alpha release (tag
# vX.Y.Z-alpha.N) including installable packages (portable/MSI, AppImage,
# DMG) and a formal GitHub release. Merged Dependabot pull requests do not
# trigger the build. Version preparation is deliberately performed on a
# temporary release branch; develop is protected and must only be changed
# through a pull request.
#
# For the higher maturity levels (beta/rc/stable) see the tag-based release
# path in ci.yml ("refs/tags/v*").

on:
  # Only CI completions on develop trigger an alpha release; the conclusion
  # is evaluated in the check job (must be 'success'). Reruns of CI fire
  # this trigger again (run_attempt in the payload), which is the
  # auto-resume mechanism.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]
  # Manually trigger an alpha release (e.g. after CI repairs, when
  # no new feature commit is pending).
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version (for example 0.65.0-alpha.1)"
        required: false
        type: string

# Two pushes in quick succession would run two release preparations racing
# for the same next version number, the same release branch and the same
# GitHub release object (observed as tag-push rejections and asset-upload
# "Not Found" errors while the other run mutated the release). Serializing
# the workflow makes each release start from a settled state; with the
# default cancel-in-progress=false the latest queued run simply waits.

concurrency:
  group: release-alpha
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ################################################################
  # CHECK: releasable commit? feat/fix always release; build/chore/ci
  # (packaging, housekeeping & CI) release with a patch bump. Excludes
  # Dependabot.
  ################################################################
  check:
    name: Check for releasable commit
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run payloads carry the triggering run's head_sha; the
          # generic github.sha points at the default branch and must not be
          # used for the release decision.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history so the releasable-commit detection below can compute
          # the range since the last tag exactly like scripts/release-version.sh.
          fetch-depth: 0

      - name: Detect releasable commit
        id: detect
        env:
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event_name }}
        run: |
          SHOULD_RELEASE="false"

          # Manual trigger (workflow_dispatch): always build.
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "Manual trigger - release build will run."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CI GATE: only a SUCCESSFUL CI run may release. A failed or
          # cancelled CI run (e.g. a transient runner flake) skips the
          # release here; rerunning CI green fires this workflow again
          # (auto-resume), so no manual release rerun is ever needed.
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "CI concluded '$CONCLUSION' - release skipped (rerun CI green to auto-resume)."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never build merged Dependabot PRs (neither by actor nor by
          # the author of the pushed commits).
          if [[ "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "dependabot-preview[bot]" ]]; then
            echo "CI was triggered by Dependabot - release build will be skipped."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log -1 --format='%an' HEAD | grep -q "dependabot"; then
            echo "Head commit comes from Dependabot - release build will be skipped."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Releasable commit detection: feat (minor/major), fix/build/chore/ci
          # (patch) — packaging, housekeeping and CI changes ship without
          # needing a manual workflow dispatch afterwards. Uses the same
          # range as scripts/release-version.sh (commits since the last tag,
          # or full history when no tag exists yet).
          LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
          if [[ -n "$LAST_TAG" ]]; then
            LOG_RANGE="$LAST_TAG..HEAD"
          else
            LOG_RANGE="HEAD"
          fi
          if git log "$LOG_RANGE" --pretty=format:'%s' | grep -qE '^(feat|fix|build|chore|ci)(\(.*\))?!?:'; then
            SHOULD_RELEASE="true"
            echo "Releasable commit found (feat/fix/build/chore/ci) - release build will run."
          else
            echo "No feat/fix/build/chore/ci commit in the range - release build will be skipped."
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  ################################################################
  # VERSIONING & TAGGING: determines the next version, bumps
  # Cargo.toml + CHANGELOG, commits both, and sets the alpha tag.
  ################################################################
  version:
    name: Determine version & tag
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      release_branch: ${{ steps.bump.outputs.release_branch }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release the CI-verified commit, not the current default-branch
          # head (for workflow_run events github.sha points at develop's tip,
          # which may have moved past the tested commit).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version and tag
        id: bump
        run: |
          NEXT="$(bash scripts/release-version.sh)"
          # Determine the next free alpha number for the base version.
          COUNT="$(git tag -l "v${NEXT}-alpha.*" | wc -l)"
          COUNT=$((COUNT + 1))
          VERSION="${NEXT}-alpha.${COUNT}"
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          fi
          TAG="v${VERSION}"
          echo "Next version: $VERSION (tag: $TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Update Cargo.toml + CHANGELOG and commit them on an isolated
          # release branch. Protected `develop` must not be pushed directly.
          bash scripts/update-version.sh "$VERSION"
          bash scripts/update-changelog.sh "$VERSION"

          RELEASE_BRANCH="release/$TAG"
          # Multiple workflow runs can target the same release branch. Never
          # derive a new commit from a stale remote tip: the release branch must
          # always carry the CURRENT source (see scripts/release-branch.sh), so
          # it publishes the freshly-committed version bump on top of the
          # latest develop HEAD and overwrites any divergent/stale tip.
          git add Cargo.toml rivulet-*/Cargo.toml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No version changes to publish."
          else
            git commit -m "chore(release): prepare $TAG"
          fi

          bash scripts/release-branch.sh "$RELEASE_BRANCH"

          echo "release_branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

  ################################################################
  # ALPHA BINARIES + PACKAGES
  ################################################################
  build:
    name: Build Alpha Binaries (${{ matrix.artifact_name }})
    needs: [check, version]
    if: ${{ needs.check.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rivulet-linux-x86_64-alpha
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rivulet-windows-x86_64-alpha
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rivulet-macos-aarch64-alpha
    uses: ./.github/workflows/build-package.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      artifact_name: ${{ matrix.artifact_name }}
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.release_branch }}
    secrets: inherit

  ################################################################
  # FORMAL GITHUB RELEASE (Alpha)
  ################################################################
  github_release:
    name: Create Alpha GitHub Release
    needs: [check, version, build]
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.release_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history + tags so the release notes can be generated from
          # the commits since the previous tag (git describe/log).
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag release
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          # A release must be created even when an earlier retry left the tag
          # behind. `--verify-tag` keeps this step idempotent.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Ship the license alongside the release assets
        run: |
          # OSPS-LE-03.02: the MIT license must travel with every release, not
          # only with the source checkout. Copying LICENSE into the
          # release-assets folder before the manifest is generated puts it
          # under SHA256SUMS and attaches it via the release-assets/* glob.
          cp LICENSE release-assets/LICENSE

      - name: Generate SHA256SUMS manifest
        run: |
          # The updater refuses to run any installer that is not listed in
          # SHA256SUMS (or whose digest differs), so the manifest must cover
          # exactly the files attached to the release. docs/opengraph.png is
          # used as the release card image by softprops and must NOT be part
          # of the manifest (see the files list below). The pipeline writes
          # to a temp file OUTSIDE the scanned directory so it never reads
          # and writes the same file in one pipeline (shellcheck SC2094).
          (cd release-assets \
            && find . -type f ! -name opengraph.png ! -name SHA256SUMS -printf '%P\0' \
            | sort -z \
            | xargs -0 -r sha256sum) > SHA256SUMS.tmp
          mv SHA256SUMS.tmp release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS

      - name: Generate release notes from commits since last tag
        run: |
          # The notes body is derived from the actual commits between the
          # previous tag and this release (the "chore(release): prepare" bump
          # commit sits at HEAD and is excluded), grouped by Conventional
          # Commit type. This beats GitHub's PR-based auto-notes for a
          # workflow that pushes commits directly to develop.
          bash scripts/generate-release-notes.sh > release-notes.md

      - name: Verify release notes completeness
        run: |
          # Fails the release if any non-prepare commit since the previous
          # tag is missing from the body (or a prepare commit leaked in).
          # Runs after the notes are generated and before the release is
          # created, with the full history + tags the checkout fetched.
          python3 scripts/check-release-notes.py --notes-file release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Rivulet ${{ needs.version.outputs.version }}
          body_path: release-notes.md
          files: |
            release-assets/*
            release-assets/SHA256SUMS
            docs/opengraph.png
            docs/social-preview.png
            docs/assets/rivulet-app-icon-512.png
            docs/assets/rivulet-rich-presence-1024.png
            docs/activity-status.md
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
