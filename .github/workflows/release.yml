name: Release (Alpha)

# ALPHA CHANNEL: Builds the release binaries as soon as a new feature
# (Conventional Commit "feat:..." / "feat(...):...") is pushed to the develop
# branch. Every feature push produces a versioned alpha release
# (tag vX.Y.Z-alpha.N) including installable packages (portable/MSI, AppImage,
# DMG) and a formal GitHub release. Merged Dependabot pull requests do not
# trigger the build.
#
# For the higher maturity levels (beta/rc/stable) see the tag-based release
# path in ci.yml ("refs/tags/v*").

on:
  push:
    branches: [ develop ]
  # Manually trigger an alpha release (e.g. after CI repairs, when
  # no new feature commit is pending).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ################################################################
  # CHECK: feature commit? (excludes Dependabot)
  ################################################################
  check:
    name: Check for feature push
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - name: Detect feature commit
        id: detect
        env:
          ACTOR: ${{ github.actor }}
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          SHOULD_RELEASE="false"

          # Manual trigger (workflow_dispatch): always build.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger - release build will run."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never build merged Dependabot PRs (neither by actor nor by
          # the author of the pushed commits).
          if [[ "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "dependabot-preview[bot]" ]]; then
            echo "Push comes from Dependabot - release build will be skipped."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$COMMITS" | jq -r '.[] | .author.name' | grep -q "dependabot"; then
            echo "Push contains Dependabot commits - release build will be skipped."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Feature detection: at least one commit must start with "feat"
          # according to the Conventional Commits convention.
          if echo "$COMMITS" | jq -r '.[].message' | grep -qE '^feat(\(.*\))?:'; then
            SHOULD_RELEASE="true"
            echo "Feature commit found - release build will run."
          else
            echo "No feature commit in the push - release build will be skipped."
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  ################################################################
  # VERSIONING & TAGGING: determines the next version, bumps
  # Cargo.toml + CHANGELOG, commits both, and sets the alpha tag.
  ################################################################
  version:
    name: Determine version & tag
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version and tag
        id: bump
        run: |
          NEXT="$(bash scripts/release-version.sh)"
          # Determine the next free alpha number for the base version.
          COUNT="$(git tag -l "v${NEXT}-alpha.*" | wc -l)"
          COUNT=$((COUNT + 1))
          VERSION="${NEXT}-alpha.${COUNT}"
          TAG="v${VERSION}"
          echo "Next version: $VERSION (tag: $TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Update Cargo.toml + CHANGELOG and commit them.
          bash scripts/update-version.sh "$VERSION"
          bash scripts/update-changelog.sh "$VERSION"

          git add Cargo.toml rivulet-*/Cargo.toml CHANGELOG.md
          git commit -m "chore(release): prepare $TAG"
          git push origin develop

          # Set and push the tag.
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Release tag $TAG set and pushed."

  ################################################################
  # ALPHA BINARIES + PACKAGES (only on feature push)
  ################################################################
  build:
    name: Build Alpha Binaries (${{ matrix.artifact_name }})
    needs: [check, version]
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rivulet-linux-x86_64-alpha
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rivulet-windows-x86_64-alpha
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rivulet-macos-aarch64-alpha

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libdbus-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-tools libglib2.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Install Windows release dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install msys2 --params "/NoUpdate /InstallDir:C:/msys64"
          C:/msys64/usr/bin/bash -lc "pacman -S --noconfirm mingw-w64-x86_64-pkg-config"
          echo "C:/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = "1.24.13"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          $runtimeMsi = Join-Path $env:TEMP "gstreamer-runtime-$version.msi"
          $develMsi = Join-Path $env:TEMP "gstreamer-devel-$version.msi"
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $runtimeMsi
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$version.msi" -OutFile $develMsi
          Start-Process msiexec -ArgumentList "/i", "`"$runtimeMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          Start-Process msiexec -ArgumentList "/i", "`"$develMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          $gstRoot = [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
          if (-not $gstRoot) { $gstRoot = "C:\gstreamer\1.0\msvc_x86_64\" }
          $gstBin = Join-Path $gstRoot "bin"
          $pkgPath = Join-Path $gstRoot "lib\pkgconfig"
          $gstPlugins = Join-Path $gstRoot "lib\gstreamer-1.0"
          $gstScanner = Join-Path $gstRoot "libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          echo "PKG_CONFIG_PATH=$pkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SYSTEM_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SCANNER=$gstScanner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_REGISTRY=$env:TEMP\gst-registry.bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo $gstBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install macOS release dependencies
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install gstreamer

      - name: Build release binary
        run: cargo build --release --package rivulet-gui --target ${{ matrix.target }}

      # ------------------------------------------------------------------
      # PACKAGING (per platform)
      # ------------------------------------------------------------------
      - name: Stage binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/rivulet-gui staging/
          strip staging/rivulet-gui

      - name: Stage binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/rivulet-gui staging/
          strip staging/rivulet-gui

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rivulet-gui.exe" staging/rivulet-gui.exe -Force

      - name: Check code signing secrets
        id: signing
        shell: bash
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$WINDOWS_CERT_BASE64" && -n "$WINDOWS_CERT_PASSWORD" ]]; then
            echo "windows_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$MACOS_CERT_BASE64" && -n "$MACOS_CERT_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "macos_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign Windows executable (if credentials configured)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          pwsh packaging/windows/sign.ps1 -Paths "$(pwd)/staging/rivulet-gui.exe"

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/linux/build-appimage.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-linux-x86_64.AppImage"

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash packaging/macos/build-app.sh "$RELEASE_VERSION" "$(pwd)/staging"

      - name: Build unsigned DMG (macOS, no credentials)
        if: runner.os == 'macOS' && steps.signing.outputs.macos_enabled != 'true'
        shell: bash
        run: |
          bash packaging/macos/build-dmg.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-macos-aarch64.dmg"

      - name: Build portable ZIP + MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging/windows/build-portable.ps1 -Staging "$(pwd)/staging" -OutFile "$(pwd)/staging/rivulet-windows-x86_64-portable.zip"
          pwsh packaging/windows/build-msi.ps1 -Version "$env:RELEASE_VERSION" -Staging "$(pwd)/staging" -OutFile "$(pwd)/staging/rivulet-windows-x86_64.msi"

      # ------------------------------------------------------------------
      # CODE SIGNING (only if the secrets are configured)
      # ------------------------------------------------------------------
      - name: Sign Windows MSI (if credentials configured)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          pwsh packaging/windows/sign.ps1 -Paths "$(pwd)/staging/rivulet-windows-x86_64.msi"

      - name: Sign & notarize macOS app (if credentials configured)
        if: runner.os == 'macOS' && steps.signing.outputs.macos_enabled == 'true'
        shell: bash
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash packaging/macos/sign-notarize.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-macos-aarch64.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            staging/rivulet-gui
            staging/rivulet-gui.exe
            staging/rivulet-linux-x86_64.AppImage
            staging/rivulet-macos-aarch64.dmg
            staging/rivulet-windows-x86_64-portable.zip
            staging/rivulet-windows-x86_64.msi

  ################################################################
  # FORMAL GITHUB RELEASE (Alpha)
  ################################################################
  github_release:
    name: Create Alpha GitHub Release
    needs: [check, version, build]
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Rivulet ${{ needs.version.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: true
          draft: false
