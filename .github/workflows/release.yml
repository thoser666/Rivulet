name: Release (Alpha)

# ALPHA CHANNEL: Builds release binaries as soon as a releasable Conventional
# Commit is pushed to the develop branch:
#
#   feat(...)   → minor bump   (e.g. 0.20 → 0.21)
#   fix(...)    → patch bump    (e.g. 0.20.0 → 0.20.1)
#   feat!(...)  → major bump    (e.g. 0.x → 1.0)
#
# Every qualifying push produces a versioned alpha release (tag vX.Y.Z-alpha.N)
# including installable packages (portable/MSI, AppImage, DMG) and a formal
# GitHub release. Merged Dependabot pull requests do not trigger the build.
# Version preparation is deliberately performed on a temporary release branch;
# develop is protected and must only be changed through a pull request.
#
# For the higher maturity levels (beta/rc/stable) see the tag-based release
# path in ci.yml ("refs/tags/v*").

on:
  push:
    branches: [ develop ]
  # Manually trigger an alpha release (e.g. after CI repairs, when
  # no new feature commit is pending).
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version (for example 0.65.0-alpha.1)"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ################################################################
  # CHECK: feature or fix commit? (excludes Dependabot)
  ################################################################
  check:
    name: Check for releasable commit
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
    steps:
      - name: Detect releasable commit
        id: detect
        env:
          ACTOR: ${{ github.actor }}
          COMMITS: ${{ toJson(github.event.commits) }}
        run: |
          SHOULD_RELEASE="false"

          # Manual trigger (workflow_dispatch): always build.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger - release build will run."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never build merged Dependabot PRs (neither by actor nor by
          # the author of the pushed commits).
          if [[ "$ACTOR" == "dependabot[bot]" || "$ACTOR" == "dependabot-preview[bot]" ]]; then
            echo "Push comes from Dependabot - release build will be skipped."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$COMMITS" | jq -r '.[] | .author.name' | grep -q "dependabot"; then
            echo "Push contains Dependabot commits - release build will be skipped."
            echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Releasable commit detection: feat (minor/major) or fix (patch).
          # Both trigger an alpha release with the appropriate SemVer bump.
          if echo "$COMMITS" | jq -r '.[].message' | grep -qE '^(feat|fix)(\(.*\))?!?:'; then
            SHOULD_RELEASE="true"
            echo "Releasable commit found (feat/fix) - release build will run."
          else
            echo "No feat/fix commit in the push - release build will be skipped."
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

  ################################################################
  # VERSIONING & TAGGING: determines the next version, bumps
  # Cargo.toml + CHANGELOG, commits both, and sets the alpha tag.
  ################################################################
  version:
    name: Determine version & tag
    needs: check
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute version and tag
        id: bump
        run: |
          NEXT="$(bash scripts/release-version.sh)"
          # Determine the next free alpha number for the base version.
          COUNT="$(git tag -l "v${NEXT}-alpha.*" | wc -l)"
          COUNT=$((COUNT + 1))
          VERSION="${NEXT}-alpha.${COUNT}"
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          fi
          TAG="v${VERSION}"
          echo "Next version: $VERSION (tag: $TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # Update Cargo.toml + CHANGELOG and commit them on an isolated
          # release branch. Protected `develop` must not be pushed directly.
          bash scripts/update-version.sh "$VERSION"
          bash scripts/update-changelog.sh "$VERSION"

          RELEASE_BRANCH="release/$TAG"
          git switch -c "$RELEASE_BRANCH"
          git add Cargo.toml rivulet-*/Cargo.toml CHANGELOG.md
          git commit -m "chore(release): prepare $TAG"
          git push --set-upstream origin "$RELEASE_BRANCH"

          # Set and push the tag only after the release branch exists. The
          # release branch is merged by the normal PR/ruleset flow later.
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Release tag $TAG set and pushed."

  ################################################################
  # ALPHA BINARIES + PACKAGES
  ################################################################
  build:
    name: Build Alpha Binaries (${{ matrix.artifact_name }})
    needs: [check, version]
    if: ${{ needs.check.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rivulet-linux-x86_64-alpha
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rivulet-windows-x86_64-alpha
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rivulet-macos-aarch64-alpha
    uses: ./.github/workflows/build-package.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      artifact_name: ${{ matrix.artifact_name }}
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.tag }}
    secrets: inherit

  ################################################################
  # FORMAL GITHUB RELEASE (Alpha)
  ################################################################
  github_release:
    name: Create Alpha GitHub Release
    needs: [check, version, build]
    if: ${{ needs.check.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Rivulet ${{ needs.version.outputs.version }}
          files: |
            release-assets/*
            docs/opengraph.png
            docs/social-preview.png
          generate_release_notes: true
          prerelease: true
          draft: false
