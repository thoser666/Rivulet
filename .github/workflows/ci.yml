name: CI

on:
  push:
    branches: [ "**" ]
    # Tags v* trigger the beta/rc/stable release path (build_release +
    # github_release) as well as a verification build.
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ################################################################
  # LINTS & FORMATTING (runs only on Linux, but is platform-independent)
  ################################################################
  lints:
    name: Lints (Fmt & Clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub Actions workflows
        shell: bash
        run: |
          curl -sSL -o actionlint_1.7.12_linux_amd64.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          # Extract outside the checkout: the release archive also contains
          # actionlint's own README.md and must never overwrite Rivulet's README.
          tmpdir="$(mktemp -d)"
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz -C "$tmpdir"
          "$tmpdir/actionlint" -color

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      # --- HERE IS THE ADDITION ---
      - name: Install GStreamer dependencies for clippy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            libglib2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libasound2-dev

      - name: Build RIST smoke image for diagnostics
        run: docker build --pull=true -t rivulet-rist-smoke:ci docker/rist-smoke

      - name: Check RIST pipeline contract
        run: python3 scripts/check-rist-pipeline.py

      - name: Inspect RIST plugin
        run: |
          docker run --rm rivulet-rist-smoke:ci gst-launch-1.0 --version
          docker run --rm rivulet-rist-smoke:ci gst-inspect-1.0 ristsink
          docker run --rm rivulet-rist-smoke:ci gst-inspect-1.0 ristsrc

      - name: ShellCheck macOS packaging scripts
        run: |
          sudo apt-get install -y shellcheck
          shellcheck packaging/macos/*.sh scripts/release-branch.sh scripts/test-release-branch.sh

      - name: Test release-branch reconciliation
        run: bash scripts/test-release-branch.sh

      - name: Test release-notes generation
        run: bash scripts/generate-release-notes.sh --self-test

      - name: Check release-notes completeness checker
        run: python3 scripts/check-release-notes.py --self-test

      - name: Check action pin table is up to date
        run: python3 scripts/generate-action-pins.py --check

      - name: Check generated assets are up to date
        run: |
          # Run generation + comparison in a pinned ImageMagick image so the
          # check is immune to runner ImageMagick/FreeType version drift. The
          # image is pinned by content digest (there is no official ImageMagick
          # image) to guard against tag mutation; it is multi-arch (amd64/arm64).
          docker run --rm -v "$PWD:/work" -w /work --entrypoint bash \
            dpokidov/imagemagick:7.1.2-12@sha256:87998ec1b8127b2f73f626f74f7b05e8827f9d7605fa52da5370588f7e53cee1 \
            -c 'apt-get update -qq && apt-get install -y -qq python3 git >/dev/null 2>&1 && git config --global --add safe.directory /work && bash scripts/generate-assets.sh && python3 scripts/check-assets.py'

      - name: Check status color contrast (WCAG AA)
        run: python3 scripts/check-theme-contrast.py

      - name: Check OBS feature-parity checklist
        run: |
          python3 scripts/check-parity-checklist.py
          python3 scripts/check-parity-checklist.py --self-test

      - name: G5 – Benchmark framework smoke test
        run: python3 scripts/g5-benchmark.py --smoke-test

      - name: Resource-efficiency gate
        run: python3 scripts/resource-efficiency-check.py scripts/resource-efficiency-sample.json

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  ################################################################
  # DEDICATED PINNING TEST (required by the develop ruleset)
  ################################################################
  pinning_tests:
    name: Pinning-Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install native dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libglib2.0-dev libssl-dev

      - name: Run CI pinning tests
        run: cargo test -p rivulet-core --test ci_pinning --verbose

  ################################################################
  # DCO sign-off check: every commit in a pull request must carry a
  # Signed-off-by trailer matching its author (see scripts/check-dco.py).
  # Enforced on pull_request only: develop commits are squash-merged and
  # release-bot pushes to release/* cannot carry per-commit sign-offs.
  ################################################################
  dco:
    name: DCO (Signed-off-by)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history for the base range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Check out the PR head, NOT the synthetic merge ref: the merge
          # commit GitHub creates for pull_request events has no author
          # sign-off of its own and would fail the DCO check. Falls back to
          # the push SHA for push events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check DCO sign-offs on branch commits
        if: github.event_name == 'pull_request'
        run: python3 scripts/check-dco.py --base origin/develop

      - name: Verify the DCO checker itself
        run: python3 scripts/check-dco.py --self-test

  ################################################################
  # SRT interoperability smoke test
  ################################################################
  srt_receiver_smoke:
    name: SRT Receiver Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned SRT smoke image
        run: docker build --pull=true -t rivulet-srt-smoke:ci docker/srt-smoke
      - name: Run SRT receiver smoke test
        env:
          SRT_SMOKE_IMAGE: rivulet-srt-smoke:ci
        run: bash scripts/srt-receiver-smoke.sh

  ################################################################
  # RIST interoperability smoke test
  ################################################################
  rist_receiver_smoke:
    name: RIST Receiver Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build RIST smoke image
        run: docker build --pull=true -t rivulet-rist-smoke:ci docker/rist-smoke
      - name: Run RIST receiver smoke test
        env:
          RIST_SMOKE_IMAGE: rivulet-rist-smoke:ci
        run: bash scripts/rist-receiver-smoke.sh

  ################################################################
  # OBS WebSocket loopback smoke test
  # Starts the v5 server on 127.0.0.1 and drives it with a real
  # (non-mock) tungstenite client: handshake, auth, scene switching,
  # recording/streaming control, batches, events, clean shutdown.
  ################################################################
  obs_websocket_smoke:
    name: OBS WebSocket Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Run OBS WebSocket loopback smoke test
        run: cargo test -p rivulet-obs-websocket --test client_smoke -- --nocapture

  ################################################################
  # FUZZ SMOKE (libFuzzer regression run of the untrusted-input parsers)
  # Builds the fuzz targets with cargo-fuzz on nightly and runs a fixed,
  # short number of executions each. A crash (panic, overflow, hang under
  # the time budget) fails the job and uploads the crashing input as an
  # artifact. Full campaigns stay a manual task (see fuzz/README).
  ################################################################
  fuzz_smoke:
    name: Fuzz smoke (regression corpus)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly (cargo-fuzz requirement)
        # Same pinned SHA as every other dtolnay/rust-toolchain use — the
        # action's `toolchain` input, not the pin, selects nightly.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz smoke (256 runs per target)
        run: |
          # rivulet-core links glib, gstreamer and pipewire/spa via
          # gstreamer-rs / libspa; the -sys crates need the pkg-config files
          # at build time even though the fuzz targets never touch them.
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev
          bash scripts/fuzz-smoke.sh

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore

  ################################################################
  # STATEMENT-COVERAGE GATE (OpenSSF silver `test_statement_coverage80`)
  # Measures `rivulet-core` line coverage with cargo-llvm-cov on Ubuntu and
  # fails below 80%. Scope rationale (core crate, not the hook/launcher
  # shims) is documented in scripts/coverage-gate.sh and
  # docs/security/assurance-case.md.
  ################################################################
  coverage:
    name: Statement Coverage (rivulet-core >= 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install native dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools

      - name: Install llvm-tools and cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked

      - name: Run statement-coverage gate (>= 80% on rivulet-core)
        run: bash scripts/coverage-gate.sh

  ################################################################
  # ROADMAP-SYNC CHECK (README milestone table + gates doc vs GitHub)
  # The milestone sequence is owned by GitHub (canonical `M<n> – Title`
  # names). This job verifies the README "Milestone overview" table and
  # docs/milestone-quality-gates.md mirror the live milestone titles,
  # ordering, and badge ids, so a milestone rename/reorder must touch all
  # three places or CI fails. Pure Python: no Rust build needed.
  ################################################################
  roadmap_sync:
    name: Roadmap-Sync Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run roadmap-sync checker self-test
        run: python3 scripts/check-roadmap-sync.py --self-test

      - name: Validate roadmap sync against GitHub milestones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-roadmap-sync.py

  ################################################################
  # REQUIRED CI AGGREGATE (stable check name for the develop ruleset)
  ################################################################
  ci:
    name: CI
    if: ${{ always() }}
    needs: [lints, beta_gate, build_and_test, pinning_tests, srt_receiver_smoke, rist_receiver_smoke, obs_websocket_smoke, fuzz_smoke, coverage, roadmap_sync]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.lints.result }}" \
            "${{ needs.beta_gate.result }}" \
            "${{ needs.build_and_test.result }}" \
            "${{ needs.pinning_tests.result }}" \
            "${{ needs.srt_receiver_smoke.result }}" \
            "${{ needs.rist_receiver_smoke.result }}" \
            "${{ needs.obs_websocket_smoke.result }}" \
            "${{ needs.fuzz_smoke.result }}" \
            "${{ needs.coverage.result }}" \
            "${{ needs.roadmap_sync.result }}"; do
            if [[ "$result" != "success" ]]; then
              echo "A required CI job finished with: $result" >&2
              exit 1
            fi
          done

  ################################################################
  # BETA-GATE READINESS DASHBOARD (pure Python, no build needed)
  # Evaluates the six Beta-Gate criteria from README.md (roadmap
  # checkboxes, 3-OS CI matrix) plus GitHub API checks when the token
  # allows them. Informational by default: publishes the verdict to the
  # step summary without failing (the project is expected to be NOT READY
  # while it is still in alpha). Pass --fail to turn it into a gate.
  ################################################################
  beta_gate:
    name: Beta-Gate readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check beta-gate criteria
        run: |
          # Publish the Markdown dashboard to the run's step summary so the
          # beta-readiness status is visible on every push. pipefail keeps the
          # step red if the checker itself crashes.
          set -o pipefail
          python3 scripts/check-beta-gate.py --comment | tee -a "$GITHUB_STEP_SUMMARY"

  ################################################################
  # BUILD & TEST MATRIX (runs on all 3 platforms)
  ################################################################
  build_and_test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # --- Install Linux dependencies ---
      - name: Install Linux dependencies (if applicable)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libdbus-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            libglib2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libasound2-dev \
            xdotool \
            xvfb \
            x11-apps \
            x11-utils

      - name: Verify Linux game-window enumeration (xdotool)
        if: runner.os == 'Linux'
        env:
          DISPLAY: :99
          RIVULET_TEST_XDOTOOL: "1"
        run: |
          set -euo pipefail
          Xvfb "$DISPLAY" -screen 0 1280x800x24 -nolisten tcp >/tmp/rivulet-xvfb.log 2>&1 &
          xvfb_pid=$!
          test_window_pid=""
          cleanup() {
            if [ -n "$test_window_pid" ]; then kill "$test_window_pid" 2>/dev/null || true; fi
            kill "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 20); do
            if xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 0.5
          done
          xdpyinfo >/dev/null

          xmessage -display "$DISPLAY" -geometry 800x600+0+0 \
            -name RivuletGameCaptureTest \
            "Rivulet game capture CI test window" &
          test_window_pid=$!

          # The window manager maps the xmessage window asynchronously;
          # poll with xdotool until it appears instead of guessing a sleep.
          found_window=""
          for _ in $(seq 1 30); do
            if found_window="$(xdotool search --name RivuletGameCaptureTest 2>/dev/null || true)"; then
              if [ -n "$found_window" ]; then break; fi
            fi
            sleep 0.5
          done
          echo "Found CI window id(s): $found_window"
          [ -n "$found_window" ] || { echo "CI window never appeared on $DISPLAY" >&2; exit 1; }

          cargo test -p rivulet-core list_game_windows_finds_the_ci_window -- --nocapture

      # --- Cache GStreamer MSIs (Windows) ---
      - name: Cache GStreamer MSIs
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/gstreamer-cache
          key: gstreamer-msvc-1.24.13

      # --- Install Windows dependencies ---
      - name: Install Windows dependencies (if applicable)
        if: runner.os == 'Windows'
        # We use PowerShell as the shell for this step
        shell: pwsh
        run: |
          # 1. Install MSYS2 and pkg-config
          choco install msys2 --params "/NoUpdate /InstallDir:C:/msys64"
          C:/msys64/usr/bin/bash -lc "pacman -S --noconfirm mingw-w64-x86_64-pkg-config"

          # 2. Add MSYS2 to the GitHub Actions PATH (for this and all following steps)
          echo "C:/msys64/mingw64/bin" >> $env:GITHUB_PATH

          # 3. Install GStreamer (MSVC, 64-bit, runtime and dev).
          # Strategy: (a) local cache, (b) our mirrored GitHub release,
          # (c) freedesktop.org direct download. This avoids the frequent
          # 503 errors from freedesktop.org's Varnish CDN.
          $version = "1.24.13"
          $gstCacheDir = "C:/gstreamer-cache"
          if (-not (Test-Path $gstCacheDir)) { New-Item -ItemType Directory -Path $gstCacheDir -Force | Out-Null }
          $runtimeMsi = Join-Path $gstCacheDir "gstreamer-1.0-msvc-x86_64-$version.msi"
          $develMsi = Join-Path $gstCacheDir "gstreamer-1.0-devel-msvc-x86_64-$version.msi"
          $downloaded = $false
          if ((Test-Path $runtimeMsi) -and (Test-Path $develMsi)) {
            Write-Host "GStreamer MSIs found in local cache"
            $downloaded = $true
          }
          if (-not $downloaded) {
            # Try our mirrored GitHub release first (reliable, fast)
            $mirrorTag = "gstreamer-msi-$version"
            $mirrorBase = "https://github.com/thoser666/Rivulet/releases/download/$mirrorTag"
            try {
              Write-Host "Downloading GStreamer MSIs from mirrored release..."
              Invoke-WebRequest -Uri "$mirrorBase/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $runtimeMsi -TimeoutSec 120
              Invoke-WebRequest -Uri "$mirrorBase/gstreamer-1.0-devel-msvc-x86_64-$version.msi" -OutFile $develMsi -TimeoutSec 120
              Write-Host "Downloaded from mirrored release"
              $downloaded = $true
            } catch {
              Write-Host "Mirror download failed: $_"
            }
          }
          if (-not $downloaded) {
            # Fallback: freedesktop.org direct download
            $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading from freedesktop.org (attempt $attempt/3)..."
                Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $runtimeMsi -TimeoutSec 120
                Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$version.msi" -OutFile $develMsi -TimeoutSec 120
                Write-Host "Downloaded from freedesktop.org"
                $downloaded = $true
                break
              } catch {
                Write-Host "Download failed: $_"
                if ($attempt -eq 3) {
                  Write-Host "WARNING: All GStreamer download sources failed."
                  Write-Host "Run: scripts/mirror-gstreamer-msi.sh $version"
                  Write-Host "to upload MSIs to the mirrored release."
                } else {
                  Start-Sleep -Seconds (10 * $attempt)
                }
              }
            }
          }
          if ($downloaded) {
            Start-Process msiexec -ArgumentList "/i", "`"$runtimeMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
            Start-Process msiexec -ArgumentList "/i", "`"$develMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          } else {
            Write-Host "::error::GStreamer MSIs could not be downloaded from any source."
            Write-Host "::error::To fix: run 'scripts/mirror-gstreamer-msi.sh' when freedesktop.org is available."
            exit 1
          }

          # 4. Set paths for all following steps. The installer registers
          # the root in the machine environment variable; the default location
          # C:\gstreamer\1.0\msvc_x86_64 serves as fallback.
          $gstRoot = [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
          if (-not $gstRoot) { $gstRoot = "C:\gstreamer\1.0\msvc_x86_64\" }
          $gstBin = Join-Path $gstRoot "bin"
          $pkgPath = Join-Path $gstRoot "lib\pkgconfig"
          $gstPlugins = Join-Path $gstRoot "lib\gstreamer-1.0"
          $gstScanner = Join-Path $gstRoot "libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          echo "PKG_CONFIG_PATH=$pkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SYSTEM_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SCANNER=$gstScanner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_REGISTRY=$env:TEMP\gst-registry.bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo $gstBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # --- Verify GStreamer plugin availability (Windows only) ---
      - name: Verify GStreamer plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gst-inspect-1.0.exe --version
          Write-Host "GST_PLUGIN_PATH=$env:GST_PLUGIN_PATH"
          Write-Host "GST_PLUGIN_SYSTEM_PATH=$env:GST_PLUGIN_SYSTEM_PATH"
          Write-Host "GST_PLUGIN_SCANNER=$env:GST_PLUGIN_SCANNER"
          foreach ($p in @("gstx264.dll","gstlibav.dll","gstcoreelements.dll","gstflv.dll")) {
            $candidate = Join-Path $env:GST_PLUGIN_PATH $p
            Write-Host "$p exists -> $(Test-Path $candidate)"
          }
          foreach ($el in @("appsrc","videoconvert","x264enc","flvmux","rtmp2sink","mp4mux","avenc_aac","filesink","tee","queue")) {
            $out = gst-inspect-1.0.exe $el 2>&1 | Out-String
            Write-Host "$el -> $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) {
              Write-Host $out
            }
          }

      # --- Install macOS dependencies ---
      - name: Install macOS dependencies (if applicable)
        if: runner.os == 'macOS'
        run: |
          # Remove the preinstalled, untrusted "aws/tap" (tap trust warning).
          brew untap aws/tap 2>/dev/null || true
          brew install gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test pre-Rust launcher with missing GUI binary
        run: cargo test -p rivulet-launcher --test pre_rust_smoke --verbose

      - name: Cross-platform UI smoke test
        run: cargo test -p rivulet-gui --test ui_smoke --verbose

      - name: UI accessibility contract
        run: cargo test -p rivulet-gui --test ui_accessibility --verbose

      - name: egui UI regression snapshots
        run: cargo test -p rivulet-gui --test ui_regression --verbose

      # Runs the Discord Rich Presence adapter end-to-end against a local IPC
      # listener: a Unix-domain socket on Linux/macOS and a named pipe on
      # Windows, verifying the worker emits a real handshake + SET_ACTIVITY.
      - name: Discord adapter IPC smoke test
        run: cargo test -p rivulet-core discord -- --nocapture

      # Validates the SET_ACTIVITY payload against Discord's documented Rich
      # Presence rules (empty details, 128-char limit, asset-key format). The
      # contract test serializes every payload variant and asserts the wire
      # output conforms, so a 4000 rejection surfaces locally in CI instead of
      # on a live Discord client.
      - name: Discord payload contract check
        run: cargo test -p rivulet-core --lib payload -- --nocapture

      - name: Test
        run: cargo test --workspace --verbose

  ################################################################
  # BETA/RC/STABLE RELEASE BUILDS (tag-based, refs/tags/v*)
  # Produces versioned release binaries for every release tag
  # (e.g. v0.1.0-beta.1, v0.1.0-rc.1, v1.0.0).
  # Note: Alpha tags (vX.Y.Z-alpha.*) are skipped here because the
  # alpha channel in release.yml already produces full releases.
  ################################################################
  version:
    name: Determine version from tag
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'alpha')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.strip.outputs.version }}
    steps:
      - name: Strip leading v from tag
        id: strip
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build_release:
    name: Build Beta/RC/Stable Binaries
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'alpha')
    needs: [build_and_test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rivulet-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rivulet-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rivulet-macos-aarch64
    uses: ./.github/workflows/build-package.yml
    with:
      os: ${{ matrix.os }}
      target: ${{ matrix.target }}
      artifact_name: ${{ matrix.artifact_name }}-${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.ref }}
    secrets: inherit

  ################################################################
  # FORMAL GITHUB RELEASE (for beta/rc/stable tags)
  ################################################################
  github_release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'alpha')
    needs: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the release notes can be generated from
          # the commits since the previous tag (git describe/log).
          fetch-depth: 0

      - name: Download all release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Ship the license alongside the release assets
        run: |
          # OSPS-LE-03.02: the MIT license must travel with every release, not
          # only with the source checkout. Copying LICENSE into the
          # release-assets folder before the manifest is generated puts it
          # under SHA256SUMS and attaches it via the release-assets/* glob.
          cp LICENSE release-assets/LICENSE

      - name: Generate SHA256SUMS manifest
        run: |
          # Same contract as the alpha channel (release.yml): the manifest
          # must cover exactly the files attached to the release, because the
          # updater refuses any installer that is not listed (or whose digest
          # differs). docs/opengraph.png is the release card image and must
          # NOT be part of the manifest. The pipeline writes to a temp file
          # OUTSIDE the scanned directory (shellcheck SC2094).
          (cd release-assets \
            && find . -type f ! -name opengraph.png ! -name SHA256SUMS -printf '%P\0' \
            | sort -z \
            | xargs -0 -r sha256sum) > SHA256SUMS.tmp
          mv SHA256SUMS.tmp release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS

      - name: Generate release notes from commits since last tag
        run: |
          # Same commit-derived body as the alpha channel, grouped by
          # conventional-commit type; release-prep commits are excluded.
          bash scripts/generate-release-notes.sh > release-notes.md

      - name: Verify release notes completeness
        run: |
          # Every non-prepare commit since the previous tag must appear in
          # the body before the release is created.
          python3 scripts/check-release-notes.py --notes-file release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: |
            release-assets/*
            release-assets/SHA256SUMS
            docs/opengraph.png
            docs/social-preview.png
            docs/assets/rivulet-app-icon-512.png
            docs/assets/rivulet-rich-presence-1024.png
            docs/activity-status.md
          fail_on_unmatched_files: true
          # Mark beta/rc tags (and alpha tags) as pre-release,
          # stable tags (e.g. v1.0.0) as a full release.
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
