name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ################################################################
  # LINTS & FORMATTING (läuft nur auf Linux, ist aber plattformunabhängig)
  ################################################################
  lints:
    name: Lints (Fmt & Clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # --- HIER IST DIE ERGÄNZUNG ---
      - name: Install GStreamer dependencies for clippy
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            libglib2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
  
  ################################################################
  # BUILD & TEST MATRIX (läuft auf allen 3 Plattformen)
  ################################################################
  build_and_test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # --- Linux Abhängigkeiten installieren ---
      - name: Install Linux dependencies (if applicable)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libdbus-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            libglib2.0-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev

      # --- Windows Abhängigkeiten installieren ---
      - name: Install Windows dependencies (if applicable)
        if: runner.os == 'Windows'
        # Wir verwenden PowerShell als Shell für diesen Schritt
        shell: pwsh
        run: |
          # 1. Installiere MSYS2 und pkg-config
          choco install msys2 --params "/NoUpdate /InstallDir:C:/msys64"
          C:/msys64/usr/bin/bash -lc "pacman -S --noconfirm mingw-w64-x86_64-pkg-config"
          
          # 2. Füge MSYS2 zum GitHub Actions PATH hinzu (für diesen und alle folgenden Schritte)
          echo "C:/msys64/mingw64/bin" >> $env:GITHUB_PATH
          
          # 3. Installiere GStreamer (MSVC, 64-bit, Runtime und Dev) direkt von
          # freedesktop.org als MSI. Das Chocolatey-Paket "gstreamer-devel"
          # enthält nicht jede Release-Version (1.24.13 fehlt dort).
          $version = "1.24.13"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          $runtimeMsi = Join-Path $env:TEMP "gstreamer-runtime-$version.msi"
          $develMsi = Join-Path $env:TEMP "gstreamer-devel-$version.msi"
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $runtimeMsi
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$version.msi" -OutFile $develMsi
          Start-Process msiexec -ArgumentList "/i", "`"$runtimeMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          Start-Process msiexec -ArgumentList "/i", "`"$develMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait

          # 4. Setze Pfade für alle folgenden Schritte. Der Installer registriert
          # die Wurzel in der Maschinen-Umgebungsvariable; als Fallback dient der
          # Standardort C:\gstreamer\1.0\msvc_x86_64.
          $gstRoot = [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
          if (-not $gstRoot) { $gstRoot = "C:\gstreamer\1.0\msvc_x86_64\" }
          $gstBin = Join-Path $gstRoot "bin"
          $pkgPath = Join-Path $gstRoot "lib\pkgconfig"
          $gstPlugins = Join-Path $gstRoot "lib\gstreamer-1.0"
          $gstScanner = Join-Path $gstRoot "libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          echo "PKG_CONFIG_PATH=$pkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SYSTEM_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SCANNER=$gstScanner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_REGISTRY=$env:TEMP\gst-registry.bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo $gstBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # --- GStreamer-Plugin-Verfügbarkeit prüfen (nur Windows) ---
      - name: Verify GStreamer plugins (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          gst-inspect-1.0.exe --version
          Write-Host "GST_PLUGIN_PATH=$env:GST_PLUGIN_PATH"
          Write-Host "GST_PLUGIN_SYSTEM_PATH=$env:GST_PLUGIN_SYSTEM_PATH"
          Write-Host "GST_PLUGIN_SCANNER=$env:GST_PLUGIN_SCANNER"
          foreach ($p in @("gstx264.dll","gstlibav.dll","gstcoreelements.dll","gstflv.dll")) {
            $candidate = Join-Path $env:GST_PLUGIN_PATH $p
            Write-Host "$p exists -> $(Test-Path $candidate)"
          }
          foreach ($el in @("appsrc","videoconvert","x264enc","flvmux","rtmp2sink","mp4mux","avenc_aac","filesink","tee","queue")) {
            $out = gst-inspect-1.0.exe $el 2>&1 | Out-String
            Write-Host "$el -> $LASTEXITCODE"
            if ($LASTEXITCODE -ne 0) {
              Write-Host $out
            }
          }

      # --- macOS Abhängigkeiten installieren ---
      - name: Install macOS dependencies (if applicable)
        if: runner.os == 'macOS'
        run: |
          brew install gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

  ################################################################
  # BETA/RC/STABLE RELEASE BUILDS (tag-basiert, refs/tags/v*)
  # Erzeugt versionierte Release-Binaries für jeden Release-Tag
  # (z.B. v0.1.0-beta.1, v0.1.0-rc.1, v1.0.0).
  ################################################################
  build_release:
    name: Build Beta/RC/Stable Binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build_and_test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: rivulet-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: rivulet-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: rivulet-macos-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set release version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      # --- Release-Abhängigkeiten für alle Plattformen installieren ---
      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libdbus-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-tools libglib2.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Install Windows release dependencies
        if: runner.os == 'Windows'
        run: |
          choco install msys2 --params "/NoUpdate /InstallDir:C:/msys64"
          C:/msys64/usr/bin/bash -lc "pacman -S --noconfirm mingw-w64-x86_64-pkg-config"
          echo "C:/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = "1.24.13"
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
          $runtimeMsi = Join-Path $env:TEMP "gstreamer-runtime-$version.msi"
          $develMsi = Join-Path $env:TEMP "gstreamer-devel-$version.msi"
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $runtimeMsi
          Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$version.msi" -OutFile $develMsi
          Start-Process msiexec -ArgumentList "/i", "`"$runtimeMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          Start-Process msiexec -ArgumentList "/i", "`"$develMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          $gstRoot = [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
          if (-not $gstRoot) { $gstRoot = "C:\gstreamer\1.0\msvc_x86_64\" }
          $gstBin = Join-Path $gstRoot "bin"
          $pkgPath = Join-Path $gstRoot "lib\pkgconfig"
          echo "PKG_CONFIG_PATH=$pkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo $gstBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install macOS release dependencies
        if: runner.os == 'macOS'
        run: brew install gstreamer

      - name: Build release binary
        run: cargo build --release --package rivulet-gui --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/rivulet-gui

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ env.RELEASE_VERSION }}
          path: target/${{ matrix.target }}/release/rivulet-gui*

  ################################################################
  # FORMALES GITHUB RELEASE (für Beta/RC/Stable-Tags)
  ################################################################
  github_release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          # Beta/RC-Tags (und Alpha-Tags) als Pre-Release markieren,
          # stabile Tags (z.B. v1.0.0) als vollständiges Release.
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
