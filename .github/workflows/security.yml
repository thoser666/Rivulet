name: Security

on:
  push:
    branches: [develop]
  pull_request:
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: ${{ matrix.language }}

      - name: Install Rust and native dependencies
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install GStreamer development dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools libglib2.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev

      - name: Build for CodeQL
        uses: github/codeql-action/autobuild@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  cargo_audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          # cargo-audit warnings (for example unmaintained crates) remain in
          # the step summary. Cargo Deny is the separate gate for yanked and
          # workspace-unmaintained dependencies; audit must fail on actual
          # RustSec vulnerabilities, not informational warnings.
          denyWarnings: false

  cargo_deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  security_gate:
    name: Security
    if: ${{ always() }}
    needs: [codeql, dependency-review, cargo_audit, cargo_deny]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require security checks to pass
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CARGO_AUDIT_RESULT: ${{ needs.cargo_audit.result }}
          CARGO_DENY_RESULT: ${{ needs.cargo_deny.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CODEQL_RESULT" != "success" ]]; then
            echo "CodeQL finished with: $CODEQL_RESULT" >&2
            exit 1
          fi
          if [[ "$DEPENDENCY_REVIEW_RESULT" != "success" && "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]]; then
            echo "Dependency Review finished with: $DEPENDENCY_REVIEW_RESULT" >&2
            exit 1
          fi
          if [[ "$CARGO_AUDIT_RESULT" != "success" ]]; then
            echo "Cargo Audit finished with: $CARGO_AUDIT_RESULT" >&2
            exit 1
          fi
          if [[ "$CARGO_DENY_RESULT" != "success" ]]; then
            echo "Cargo Deny finished with: $CARGO_DENY_RESULT" >&2
            exit 1
          fi
