name: OpenSSF Scorecard

on:
  push:
    branches: [develop]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# Keep the workflow-level token read-only. The two write scopes Scorecard
# needs — `security-events` for the SARIF upload and `id-token` for
# `publish_results` — are declared on the `scorecard` job below, and GitHub
# applies job-level permissions on their own, so repeating them here granted
# them to the workflow default for no benefit. That top-level write was the
# only thing code-scanning alert #92 (`TokenPermissionsID`, high) flagged and
# it scored the workflow 0, which failed the required `Security` check on
# `develop`.
permissions:
  contents: read

# A newer run for the same ref supersedes the older one: pushing twice to a
# pull-request branch cancels the superseded scan instead of queueing a second
# one behind it. Pushes to develop, scheduled runs and manual dispatches are
# never cancelled (the weekly scan still publishes its result).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload Scorecard SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard-results.sarif
          category: openssf-scorecard
