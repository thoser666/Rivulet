name: Build & Package

# Reusable release pipeline for a single platform: installs the platform
# dependencies, builds the release binary, packages it (AppImage / DMG /
# portable ZIP + MSI) and signs the artifacts when the matching secrets are
# configured. Called by ci.yml (beta/rc/stable tags) and release.yml (alpha
# channel) to avoid duplicating the packaging and signing steps.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      version:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ inputs.target }}

      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libdbus-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-tools libglib2.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Cache GStreamer MSIs
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/gstreamer-cache
          key: gstreamer-msvc-1.24.13

      - name: Install Windows release dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install msys2 --params "/NoUpdate /InstallDir:C:/msys64"
          C:/msys64/usr/bin/bash -lc "pacman -S --noconfirm mingw-w64-x86_64-pkg-config"
          echo "C:/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = "1.24.13"
          $gstCacheDir = "C:/gstreamer-cache"
          if (-not (Test-Path $gstCacheDir)) { New-Item -ItemType Directory -Path $gstCacheDir -Force | Out-Null }
          $runtimeMsi = Join-Path $gstCacheDir "gstreamer-1.0-msvc-x86_64-$version.msi"
          $develMsi = Join-Path $gstCacheDir "gstreamer-1.0-devel-msvc-x86_64-$version.msi"
          $downloaded = $false
          if ((Test-Path $runtimeMsi) -and (Test-Path $develMsi)) {
            Write-Host "GStreamer MSIs found in local cache"
            $downloaded = $true
          }
          if (-not $downloaded) {
            $mirrorTag = "gstreamer-msi-$version"
            $mirrorBase = "https://github.com/thoser666/Rivulet/releases/download/$mirrorTag"
            try {
              Write-Host "Downloading GStreamer MSIs from mirrored release..."
              Invoke-WebRequest -Uri "$mirrorBase/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $runtimeMsi -TimeoutSec 120
              Invoke-WebRequest -Uri "$mirrorBase/gstreamer-1.0-devel-msvc-x86_64-$version.msi" -OutFile $develMsi -TimeoutSec 120
              Write-Host "Downloaded from mirrored release"
              $downloaded = $true
            } catch {
              Write-Host "Mirror download failed: $_"
            }
          }
          if (-not $downloaded) {
            $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc"
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Write-Host "Downloading from freedesktop.org (attempt $attempt/3)..."
                Invoke-WebRequest -Uri "$base/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $runtimeMsi -TimeoutSec 120
                Invoke-WebRequest -Uri "$base/gstreamer-1.0-devel-msvc-x86_64-$version.msi" -OutFile $develMsi -TimeoutSec 120
                Write-Host "Downloaded from freedesktop.org"
                $downloaded = $true
                break
              } catch {
                Write-Host "Download failed: $_"
                if ($attempt -eq 3) {
                  Write-Host "ERROR: All GStreamer download sources failed."
                  Write-Host "Run: scripts/mirror-gstreamer-msi.sh $version"
                  exit 1
                } else {
                  Start-Sleep -Seconds (10 * $attempt)
                }
              }
            }
          }
          Start-Process msiexec -ArgumentList "/i", "`"$runtimeMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          Start-Process msiexec -ArgumentList "/i", "`"$develMsi`"", "/qn", "/norestart", "INSTALLLEVEL=100" -Wait
          $gstRoot = [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
          if (-not $gstRoot) { $gstRoot = "C:\gstreamer\1.0\msvc_x86_64\" }
          $gstBin = Join-Path $gstRoot "bin"
          $pkgPath = Join-Path $gstRoot "lib\pkgconfig"
          $gstPlugins = Join-Path $gstRoot "lib\gstreamer-1.0"
          $gstScanner = Join-Path $gstRoot "libexec\gstreamer-1.0\gst-plugin-scanner.exe"
          echo "PKG_CONFIG_PATH=$pkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SYSTEM_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_PATH=$gstPlugins" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_PLUGIN_SCANNER=$gstScanner" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "GST_REGISTRY=$env:TEMP\gst-registry.bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo $gstBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install macOS release dependencies
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install gstreamer

      - name: Build release binary
        run: cargo build --release --package rivulet-gui --package rivulet-launcher --package rivulet-updater --target ${{ inputs.target }}

      # ------------------------------------------------------------------
      # PACKAGING (per platform)
      # ------------------------------------------------------------------
      - name: Stage binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ inputs.target }}/release/rivulet-gui staging/
          strip staging/rivulet-gui

      - name: Stage binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ inputs.target }}/release/rivulet-gui staging/
          strip staging/rivulet-gui

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ inputs.target }}/release/rivulet-gui.exe" staging/rivulet-gui.exe -Force
          Copy-Item "target/${{ inputs.target }}/release/rivulet-launcher.exe" staging/rivulet.exe -Force
          Copy-Item "target/${{ inputs.target }}/release/rivulet-updater.exe" staging/rivulet-updater.exe -Force

      - name: Check code signing secrets
        id: signing
        shell: bash
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$WINDOWS_CERT_BASE64" && -n "$WINDOWS_CERT_PASSWORD" ]]; then
            echo "windows_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$MACOS_CERT_BASE64" && -n "$MACOS_CERT_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "macos_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign Windows executable (if credentials configured)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          pwsh packaging/windows/sign.ps1 -Paths "$(pwd)/staging/rivulet-gui.exe", "$(pwd)/staging/rivulet.exe", "$(pwd)/staging/rivulet-updater.exe"

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/linux/build-appimage.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-linux-x86_64.AppImage"

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash packaging/macos/build-app.sh "$RELEASE_VERSION" "$(pwd)/staging"

      - name: Build unsigned DMG (macOS, no credentials)
        if: runner.os == 'macOS' && steps.signing.outputs.macos_enabled != 'true'
        shell: bash
        run: |
          bash packaging/macos/build-dmg.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-macos-aarch64.dmg"

      - name: Build portable ZIP + MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging/windows/build-portable.ps1 -Staging "$(pwd)/staging" -OutFile "$(pwd)/staging/rivulet-windows-x86_64-portable.zip"
          pwsh packaging/windows/build-msi.ps1 -Version "$env:RELEASE_VERSION" -Staging "$(pwd)/staging" -OutFile "$(pwd)/staging/rivulet-windows-x86_64.msi"

      # ------------------------------------------------------------------
      # CODE SIGNING (only if the secrets are configured)
      # ------------------------------------------------------------------
      - name: Sign Windows MSI (if credentials configured)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_enabled == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          pwsh packaging/windows/sign.ps1 -Paths "$(pwd)/staging/rivulet-windows-x86_64.msi"

      - name: Sign & notarize macOS app (if credentials configured)
        if: runner.os == 'macOS' && steps.signing.outputs.macos_enabled == 'true'
        shell: bash
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash packaging/macos/sign-notarize.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-macos-aarch64.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            staging/rivulet-gui
            staging/rivulet-gui.exe
            staging/rivulet.exe
            staging/rivulet-linux-x86_64.AppImage
            staging/rivulet-macos-aarch64.dmg
            staging/rivulet-windows-x86_64-portable.zip
            staging/rivulet-windows-x86_64.msi
