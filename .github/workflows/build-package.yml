name: Build & Package

# Reusable release pipeline for a single platform: installs the platform
# dependencies, builds the release binary, packages it (AppImage / DMG /
# portable ZIP + MSI) and signs the artifacts when the matching secrets are
# configured. Called by ci.yml (beta/rc/stable tags) and release.yml (alpha
# channel) to avoid duplicating the packaging and signing steps.

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      version:
        required: true
        type: string
      ref:
        required: true
        type: string

permissions:
  contents: read
  # The SignPath submit-signing-request action downloads the workflow
  # artifact with the workflow token (needs `actions: read` when the
  # SignPath GitHub App is not installed or the repository is private).
  actions: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
          token: ${{ github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ inputs.target }}

      - name: Install Linux release dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libdbus-1-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            gstreamer1.0-tools libglib2.0-dev \
            libpipewire-0.3-dev libspa-0.2-dev

      - name: Cache GStreamer MSIs
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/gstreamer-cache
          key: gstreamer-msvc-1.26.11

      - name: Install Windows release dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install msys2 --params "/NoUpdate /InstallDir:C:/msys64"
          C:/msys64/usr/bin/bash -lc "pacman -S --noconfirm mingw-w64-x86_64-pkg-config"
          echo "C:/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Shared helper: handles the classic MSI pair (<= 1.26) AND the
          # unified Inno Setup .exe installer (>= 1.28), with cache →
          # mirror → freedesktop fallback and SHA256 verification against
          # the official .sha256sum (the 1.28 installers are unsigned).
          pwsh packaging/windows/install-gstreamer.ps1 -Version "1.26.11"

      - name: Install macOS release dependencies
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install gstreamer

      - name: Build release binary
        run: cargo build --release --package rivulet-gui --package rivulet-launcher --package rivulet-updater --target ${{ inputs.target }}

      # ------------------------------------------------------------------
      # PACKAGING (per platform)
      # ------------------------------------------------------------------
      - name: Stage binary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ inputs.target }}/release/rivulet-gui staging/
          strip staging/rivulet-gui
          # Platform-qualified copy for the bare-binary upload: Linux and macOS
          # would both upload a file named "rivulet-gui", and the release job's
          # actions/download-artifact (merge-multiple: true) collapses same-
          # named files from different artifacts into ONE release asset,
          # silently dropping one platform's binary (observed on alpha.138,
          # where SHA256SUMS listed "rivulet-gui" exactly once). The packaging
          # steps below keep reading staging/rivulet-gui; only the upload list
          # references the qualified copy.
          cp staging/rivulet-gui staging/rivulet-linux-x86_64-gui

      - name: Stage binary (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p staging
          cp target/${{ inputs.target }}/release/rivulet-gui staging/
          strip staging/rivulet-gui
          # Platform-qualified upload copy (see the Linux stage step for the
          # merge-multiple collision rationale).
          cp staging/rivulet-gui staging/rivulet-macos-aarch64-gui

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "target/${{ inputs.target }}/release/rivulet-gui.exe" staging/rivulet-gui.exe -Force
          Copy-Item "target/${{ inputs.target }}/release/rivulet-launcher.exe" staging/rivulet.exe -Force
          Copy-Item "target/${{ inputs.target }}/release/rivulet-updater.exe" staging/rivulet-updater.exe -Force

      - name: Check code signing secrets
        id: signing
        shell: bash
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [[ -n "$WINDOWS_CERT_BASE64" && -n "$WINDOWS_CERT_PASSWORD" ]]; then
            echo "windows_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "windows_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$MACOS_CERT_BASE64" && -n "$MACOS_CERT_PASSWORD" && -n "$APPLE_ID" && -n "$APPLE_APP_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            echo "macos_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$LINUX_GPG_PRIVATE_KEY" ]]; then
            echo "linux_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "linux_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          # SignPath Foundation (free for open source) takes precedence over
          # the PFX path: the certificate stays in SignPath's HSM and the
          # artifacts are signed file-based via a signing request. All four
          # secrets must be present for the path to activate.
          if [[ -n "$SIGNPATH_API_TOKEN" && -n "$SIGNPATH_ORGANIZATION_ID" && -n "$SIGNPATH_PROJECT_SLUG" && -n "$SIGNPATH_SIGNING_POLICY_SLUG" ]]; then
            echo "signpath_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "signpath_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------------
      # WINDOWS SIGNING — SignPath Foundation (free for open source) takes
      # precedence over the PFX path; the two are mutually exclusive. The
      # SignPath action signs artifacts file-based: the unsigned files are
      # uploaded as a GitHub artifact, SignPath signs them in its HSM (the
      # certificate never leaves the vault) and the signed artifact is
      # downloaded back into staging.
      # ------------------------------------------------------------------
      - name: Upload Windows EXEs for SignPath signing
        if: runner.os == 'Windows' && steps.signing.outputs.signpath_enabled == 'true'
        id: signpath-upload-exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivulet-windows-unsigned-exe-${{ github.run_id }}
          path: |
            staging/rivulet-gui.exe
            staging/rivulet.exe
            staging/rivulet-updater.exe

      - name: Submit SignPath signing request (EXEs)
        if: runner.os == 'Windows' && steps.signing.outputs.signpath_enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.signpath-upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed/exe
          parameters: |
            version: "${{ inputs.version }}"

      - name: Copy signed EXEs back into staging
        if: runner.os == 'Windows' && steps.signing.outputs.signpath_enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item "signpath-signed/exe/rivulet-gui.exe" staging/rivulet-gui.exe -Force
          Copy-Item "signpath-signed/exe/rivulet.exe" staging/rivulet.exe -Force
          Copy-Item "signpath-signed/exe/rivulet-updater.exe" staging/rivulet-updater.exe -Force

      - name: Sign Windows executable (PFX, if credentials configured)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_enabled == 'true' && steps.signing.outputs.signpath_enabled != 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          pwsh packaging/windows/sign.ps1 -Paths "$(pwd)/staging/rivulet-gui.exe", "$(pwd)/staging/rivulet.exe", "$(pwd)/staging/rivulet-updater.exe"

      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash packaging/linux/build-appimage.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-linux-x86_64.AppImage"

      - name: Sign Linux AppImage with GPG (if credentials configured)
        if: runner.os == 'Linux' && steps.signing.outputs.linux_enabled == 'true'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          bash packaging/linux/sign-gpg.sh "$(pwd)/staging/rivulet-linux-x86_64.AppImage"

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash packaging/macos/build-app.sh "$RELEASE_VERSION" "$(pwd)/staging"

      - name: Build unsigned DMG (macOS, no credentials)
        if: runner.os == 'macOS' && steps.signing.outputs.macos_enabled != 'true'
        shell: bash
        run: |
          bash packaging/macos/build-dmg.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-macos-aarch64.dmg"

      - name: Build portable ZIP + MSI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh packaging/windows/build-portable.ps1 -Staging "$(pwd)/staging" -OutFile "$(pwd)/staging/rivulet-windows-x86_64-portable.zip"
          pwsh packaging/windows/build-msi.ps1 -Version "$env:RELEASE_VERSION" -Staging "$(pwd)/staging" -OutFile "$(pwd)/staging/rivulet-windows-x86_64.msi"

      # ------------------------------------------------------------------
      # CODE SIGNING (only if the secrets are configured)
      # ------------------------------------------------------------------
      - name: Upload MSI for SignPath signing
        if: runner.os == 'Windows' && steps.signing.outputs.signpath_enabled == 'true'
        id: signpath-upload-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rivulet-windows-unsigned-msi-${{ github.run_id }}
          path: staging/rivulet-windows-x86_64.msi

      - name: Submit SignPath signing request (MSI)
        if: runner.os == 'Windows' && steps.signing.outputs.signpath_enabled == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.signpath-upload-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-signed/msi
          parameters: |
            version: "${{ inputs.version }}"

      - name: Copy signed MSI back into staging
        if: runner.os == 'Windows' && steps.signing.outputs.signpath_enabled == 'true'
        shell: pwsh
        run: |
          Copy-Item "signpath-signed/msi/rivulet-windows-x86_64.msi" staging/rivulet-windows-x86_64.msi -Force

      - name: Sign Windows MSI (PFX, if credentials configured)
        if: runner.os == 'Windows' && steps.signing.outputs.windows_enabled == 'true' && steps.signing.outputs.signpath_enabled != 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          pwsh packaging/windows/sign.ps1 -Paths "$(pwd)/staging/rivulet-windows-x86_64.msi"

      - name: Sign & notarize macOS app (if credentials configured)
        if: runner.os == 'macOS' && steps.signing.outputs.macos_enabled == 'true'
        shell: bash
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          bash packaging/macos/sign-notarize.sh "$RELEASE_VERSION" "$(pwd)/staging" "$(pwd)/staging/rivulet-macos-aarch64.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            staging/rivulet-gui.exe
            staging/rivulet.exe
            staging/rivulet-linux-x86_64-gui
            staging/rivulet-macos-aarch64-gui
            staging/rivulet-linux-x86_64.AppImage
            staging/rivulet-linux-x86_64.AppImage.asc
            staging/rivulet-macos-aarch64.dmg
            staging/rivulet-windows-x86_64-portable.zip
            staging/rivulet-windows-x86_64.msi
