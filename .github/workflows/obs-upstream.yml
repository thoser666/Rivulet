name: OBS upstream feature check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check latest OBS release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore last-checked release state from cache
        # Delta tracking: the checker records the tag it verified last run
        # in scripts/.obs-upstream-state.json. That file is a runtime
        # artifact (gitignored, never committed) and is carried across runs
        # through the actions cache — the unique run-id key never hits, so
        # restore-keys falls back to the previous run's save.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/.obs-upstream-state.json
          key: obs-upstream-state-${{ github.run_id }}
          restore-keys: |
            obs-upstream-state-

      - name: Validate vision criteria and run deterministic self-test
        run: |
          python3 -m json.tool scripts/vision-criteria.json >/dev/null
          python3 scripts/check-obs-upstream.py --self-test

      - name: Check latest OBS release and update vision documentation
        id: upstream
        continue-on-error: true
        run: |
          python3 scripts/check-obs-upstream.py --update-doc | tee "$RUNNER_TEMP/obs-upstream-report.md"
          cp docs/obs-vision-candidates.md "$RUNNER_TEMP/obs-vision-candidates.md"

      - name: Publish report
        if: always()
        run: cat "$RUNNER_TEMP/obs-upstream-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Save last-checked release state to cache
        # Saved on every run (also on failure): on a failed fetch the script
        # never wrote the state, so the restored previous value is simply
        # carried forward unchanged.
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/.obs-upstream-state.json
          key: obs-upstream-state-${{ github.run_id }}
          restore-keys: |
            obs-upstream-state-

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obs-upstream-report
          path: |
            ${{ runner.temp }}/obs-upstream-report.md
            ${{ runner.temp }}/obs-vision-candidates.md
          if-no-files-found: warn
