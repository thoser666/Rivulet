name: OBS upstream feature check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check latest OBS release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run deterministic self-test
        run: python3 scripts/check-obs-upstream.py --self-test

      - name: Check latest OBS release
        id: upstream
        continue-on-error: true
        run: python3 scripts/check-obs-upstream.py | tee "$RUNNER_TEMP/obs-upstream-report.md"

      - name: Publish report
        if: always()
        run: cat "$RUNNER_TEMP/obs-upstream-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.1.0
        with:
          name: obs-upstream-report
          path: ${{ runner.temp }}/obs-upstream-report.md
          if-no-files-found: warn
