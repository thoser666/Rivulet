name: OBS upstream feature check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  # The checker sweeps this repository's open issues (GitHub REST API) and
  # the weekly run creates/updates the labeled review issue with the merged
  # report and its review checklist.
  issues: write

# Serialized: two runs would read the same cached delta state and both try to
# create or update the single review issue. A manual dispatch waits for the
# scheduled run instead of cancelling it.
concurrency:
  group: obs-upstream
  cancel-in-progress: false

jobs:
  check:
    name: Check latest OBS release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore last-checked release state from cache
        # Delta tracking: the checker records the tag it verified last run
        # in scripts/.obs-upstream-state.json. That file is a runtime
        # artifact (gitignored, never committed) and is carried across runs
        # through the actions cache — the unique run-id key never hits, so
        # restore-keys falls back to the previous run's save.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/.obs-upstream-state.json
          key: obs-upstream-state-${{ github.run_id }}
          restore-keys: |
            obs-upstream-state-

      - name: Validate vision criteria and run deterministic self-test
        run: |
          python3 -m json.tool scripts/vision-criteria.json >/dev/null
          python3 scripts/check-obs-upstream.py --self-test

      - name: Check latest OBS release, sweep Rivulet issues, update vision docs
        id: upstream
        run: |
          python3 scripts/check-obs-upstream.py --update-doc \
            --checklist-file "$RUNNER_TEMP/obs-checklist.md" | tee "$RUNNER_TEMP/obs-upstream-report.md"
          # Fail loudly instead of masking: the pipeline already fails on a
          # checker error (pipefail), and an empty or header-less report
          # (the silent failure mode that emptied the weekly artifact before)
          # must abort the run too. Both sections (OBS release notes and the
          # Rivulet open-issue sweep) must be present.
          if [ ! -s "$RUNNER_TEMP/obs-upstream-report.md" ] \
             || ! grep -q "## OBS upstream check" "$RUNNER_TEMP/obs-upstream-report.md" \
             || ! grep -q "## Rivulet open issues" "$RUNNER_TEMP/obs-upstream-report.md"; then
            echo "::error::OBS upstream report is empty or malformed — no usable report produced"
            exit 1
          fi
          cp docs/obs-vision-candidates.md "$RUNNER_TEMP/obs-vision-candidates.md"
          cp docs/community-wish-candidates.md "$RUNNER_TEMP/community-wish-candidates.md"

      - name: Publish report
        if: always()
        run: cat "$RUNNER_TEMP/obs-upstream-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure the obs-upstream label exists
        # `gh label create --force` creates the label or updates it in place, so
        # the step is idempotent. It deliberately does not swallow errors like
        # the weekly-review label below: GitHub silently drops labels it does
        # not know when an issue is created, so a failed creation here would
        # otherwise leave the new candidate threads unlabelled without a trace.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "obs-upstream" \
            --repo "$GITHUB_REPOSITORY" \
            --color "0052cc" \
            --description "Automated OBS upstream release-note candidate (weekly sweep)" \
            --force

      - name: Sync OBS candidates to tracked issues (dedupe by upstream title)
        # One issue per upstream release-note candidate. When a thread already
        # tracks the same title it is updated in place, so consecutive runs
        # cannot file the same change two or three times again (the earlier
        # sweep produced several duplicate threads for one upstream PR). Closed
        # threads are part of the key and stay closed, so a decided candidate
        # does not return as a new issue every week, and only strong-fit/review
        # candidates create one.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-obs-upstream.py --sync-issues \
            --issues-repo "$GITHUB_REPOSITORY"

      - name: Publish weekly review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LABEL="weekly-vision-review"
          # `--force` rewrites the label on every run, so the colour has to be
          # part of the command: without `--color` gh resets it to #0E8A16 and
          # the first weekly run silently repaints the label.
          gh label create "$LABEL" \
            --color "BFD4F2" \
            --description "Automated weekly vision review (OBS upstream + community wishes)" \
            --force >/dev/null 2>&1 || true
          DATE="$(date -u +%F)"
          TAG="$(head -1 "$RUNNER_TEMP/obs-upstream-report.md" | grep -o '[0-9][0-9.]*$' || echo 'unknown')"
          TITLE="Weekly vision review — ${DATE} — OBS ${TAG}"
          {
            cat "$RUNNER_TEMP/obs-upstream-report.md"
            printf '\n\n## Review checklist\n\n'
            cat "$RUNNER_TEMP/obs-checklist.md"
          } > "$RUNNER_TEMP/weekly-review.md"
          EXISTING="$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --limit 100 \
            --json number,title --jq ".[] | select(.title | startswith(\"Weekly vision review — ${DATE}\")) | .number" \
            | head -1 || true)"
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file "$RUNNER_TEMP/weekly-review.md"
          else
            NEW="$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body-file "$RUNNER_TEMP/weekly-review.md" --label "$LABEL")"
            NEW_NUMBER="$(basename "$NEW")"
            # Keep exactly one open review issue: close older weekly issues so
            # the label list stays a rolling single review queue.
            for N in $(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open \
              --json number --jq '.[].number'); do
              if [ "$N" != "$NEW_NUMBER" ]; then
                gh issue close "$N" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
              fi
            done
          fi

      - name: Save last-checked release state to cache
        # Saved on every run (also on failure): on a failed fetch the script
        # never wrote the state, so the restored previous value is simply
        # carried forward unchanged.
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/.obs-upstream-state.json
          key: obs-upstream-state-${{ github.run_id }}
          restore-keys: |
            obs-upstream-state-

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obs-upstream-report
          path: |
            ${{ runner.temp }}/obs-upstream-report.md
            ${{ runner.temp }}/obs-vision-candidates.md
            ${{ runner.temp }}/community-wish-candidates.md
          if-no-files-found: warn
