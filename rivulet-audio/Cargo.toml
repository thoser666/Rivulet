[package]
name = "rivulet-audio"
version.workspace = true
edition = "2021"
license.workspace = true
description = "System and microphone audio capture for Rivulet"

[dependencies]
rivulet-core = { path = "../rivulet-core" }
anyhow = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "=0.15.3"

[dev-dependencies]
tracing-subscriber = { workspace = true }
xcap = { workspace = true }

[[example]]
name = "record_screen_audio"
path = "examples/record_screen_audio.rs"
