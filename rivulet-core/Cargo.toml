[package]
name = "rivulet-core"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Core engine for Rivulet streaming software"

[dependencies]
# Workspace dependencies (unchanged)
tokio = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
anyhow = { workspace = true }
tracing = { workspace = true }

# Other core dependencies (unchanged)
chrono = { version = "0.4.35", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
crossbeam-channel = "0.5"
parking_lot = "0.12"
dirs = "6.0"
toml = "1.1"
async-trait = "0.1"
ureq = { version = "3.4", default-features = false, features = ["json", "rustls"] }
sha2 = { workspace = true }
hmac = { workspace = true }
base64 = { workspace = true }
keyring = { version = "3.6", default-features = false }

gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

# Provides the `parse_launch` function in newer gstreamer-rs versions.
gstreamer-pbutils = "0.25"

# Vulkan bindings (G3: Vulkan hook / interposition)
ash = { version = "0.38", default-features = true }

# This crate is often needed as a helper library.
glib = "0.22"

# `once_cell` is used for the safe, one-time initialization of GStreamer.
once_cell = "1.19.0"

# Linux-specific dependencies (game capture via xcap)
[target.'cfg(target_os = "linux")'.dependencies]
xcap = "=0.9.8"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# winapi modules are enabled per consumer to keep the attack surface minimal:
#  - memoryapi / winbase / handleapi: shared-memory capture channel + OpenGL
#    hook (capture_channel.rs, opengl_hook.rs) and the adapter's CloseHandle.# -  fileapi / namedpipeapi / winnt: Discord Rich Presence named-pipe client
#    (discord.rs — CreateFileW/WriteFile and WaitNamedPipeW). winapi features
#    are module-granular; only modules whose functions are actually called are
#    enabled. winapi (MIT/Apache-2.0) is already allowed by deny.toml and pinned
#    as winapi 0.3.9 in Cargo.lock (adding these features does not change the
#    locked version or the Cargo.lock checksum).
# -  winuser: global hotkeys (global_hotkey.rs — RegisterHotKey/UnregisterHotKey
#    behind a message pump).
winapi = { version = "0.3", features = ["memoryapi", "winbase", "winnt", "handleapi", "fileapi", "namedpipeapi", "winuser"] }

[dev-dependencies]
tempfile = "3"
