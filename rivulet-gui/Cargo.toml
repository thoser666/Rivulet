[package]
name = "rivulet-gui"
version.workspace = true
edition = "2021"
rust-version = "1.70"
license.workspace = true

[dependencies]
# GUI framework. AccessKit (native AT bridges: Windows UIA, macOS AX,
# Linux AT-SPI) is enabled per-target below: it stays OFF on Linux because
# accesskit_unix connects to DBus (zbus) from a foreign OS thread, which
# conflicts with the app's Tokio runtime — see the comment in
# `src/main.rs::configure_bundled_gstreamer` history. The base declaration
# keeps the Linux-sane feature set; the extra `accesskit` feature is added
# only for non-Linux targets via the target-specific section (Cargo
# resolver "2" unifies the two declarations, activating the feature only on
# the matched targets).
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }

# Dependencies for the Rivulet app logic
log = "0.4.21"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4.35", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }

# Async runtime and desktop portals
tokio = { version = "1.36.0", features = ["full"] }
once_cell = "1.19.0"
serde_json = "1.0.114"
anyhow = "1.0.81"

rfd = "0.17"
open = "5.3"

# MIDI controller input (Korg NanoKontrol etc.); the mapping/parse logic
# itself lives in rivulet-core::midi and is hardware-free.
midir = "0.10"

# Local core library
rivulet-core = { path = "../rivulet-core" }

# OBS WebSocket v5 remote control (Stream Deck / TouchPortal)
rivulet-obs-websocket = { path = "../rivulet-obs-websocket" }

# Update checking and installation (GitHub Releases)
rivulet-updater = { path = "../rivulet-updater" }

# Logging library
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }
dirs = "6.0"
tempfile = "3.15"

# Image processing library for the icon
image = { version = "0.25.1", default-features = false, features = ["png", "ico"] }

# Monitor/display capture on all platforms; used for monitor previews in the
# region editor (on Linux also for capture itself)
xcap = "=0.9.8"

# winit is needed for the picker configuration on Windows
[target.'cfg(target_os = "windows")'.dependencies.winit]
version = "0.30"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.10", features = ["tokio", "screencast"] }
pipewire = { version = "0.10.0", features = ["v0_3_33"] }
rivulet-audio = { path = "../rivulet-audio" }
rivulet-capture = { path = "../rivulet-capture" }

# macOS-specific dependencies (screen/window capture via xcap which is a
# plain dependency; cpal-backed audio capture via rivulet-audio)
[target.'cfg(target_os = "macos")'.dependencies]
rivulet-audio = { path = "../rivulet-audio" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = { version = "2.0.0" }
# Capture backend status (G2): reports whether DXGI Desktop Duplication is
# the active backend or whether the GUI fell back to Windows Graphics
# Capture, plus the fallback reason.
rivulet-capture = { path = "../rivulet-capture" }
# WASAPI per-application process-loopback capture (Phase 3, issue #154).
rivulet-audio = { path = "../rivulet-audio" }

# Build dependencies
[build-dependencies]
winres = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
# WebSocket server-side accept used by the EventSub GUI test's local puppet
# (the client transport itself runs in rivulet-core; this reuses the already
# locked tungstenite 0.26 from the workspace without new versions or licenses).
tungstenite = "0.26"

# Screen-reader / assistive-technology support on Windows (UIA/Narrator) and
# macOS (AX/VoiceOver). Excluded on Linux only: accesskit_unix talks zbus from
# a foreign thread there, which races the Tokio reactor. The base eframe
# declaration above keeps the Linux-sane feature set; this target-specific
# section re-declares eframe with the extra `accesskit` feature (Cargo
# resolver "2" unifies the two declarations, activating the feature only on
# the matched targets).
[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
