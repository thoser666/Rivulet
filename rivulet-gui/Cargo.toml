[package]
name = "rivulet-gui"
version.workspace = true
edition = "2021"
rust-version = "1.70"

[dependencies]
# GUI framework (accesskit disabled: zbus/Tokio conflict on Linux,
# accesskit_unix connects to DBus from a foreign thread)
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }

# Dependencies for the Rivulet app logic
log = "0.4.21"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4.35", features = ["serde"] }

# Async runtime and desktop portals
tokio = { version = "1.36.0", features = ["full"] }
once_cell = "1.19.0"
serde_json = "1.0.114"
anyhow = "1.0.81"

rfd = "0.17"

# Local core library
rivulet-core = { path = "../rivulet-core" }

# Update checking and installation (GitHub Releases)
rivulet-updater = { path = "../rivulet-updater" }

# Logging library
tracing-subscriber = { version = "0.3.18", features = ["fmt"] }

# Image processing library for the icon
image = { version = "0.25.1", features = ["png"] }

# Monitor/display capture on all platforms; used for monitor previews in the
# region editor (on Linux also for capture itself)
xcap = "=0.9.8"

# winit is needed for the picker configuration on Windows
[target.'cfg(target_os = "windows")'.dependencies.winit]
version = "0.30"

# Linux-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.10", features = ["tokio", "screencast"] }
pipewire = { version = "0.10.0", features = ["v0_3_33"] }
rivulet-audio = { path = "../rivulet-audio" }



[target.'cfg(target_os = "windows")'.dependencies.windows-capture]
version = "2.0.0"

# Build dependencies
[build-dependencies]
winres = "0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe"] }
