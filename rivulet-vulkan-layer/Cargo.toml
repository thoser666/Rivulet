[package]
name = "rivulet-vulkan-layer"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Vulkan implicit layer for zero-overhead game capture (G3)"

# cdylib produces the .dll/.so that the Vulkan loader loads into the game
# process. rlib is also produced so `cargo test` can link the unit tests.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Low-level Vulkan bindings — only the types are used by the layer itself;
# the smoke test (tests/smoke.rs) uses the loader functions to drive a real
# Vulkan instance and exercise the layer.
ash = "0.38"
# Platform-independent status reporting (same pattern as
# rivulet-capture/src/backend.rs).
anyhow = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["memoryapi", "winbase", "winnt", "handleapi"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = "1.0"

# The live smoke test (tests/smoke.rs) needs a real window to present to on
# Windows. winit is already in the tree via rivulet-gui; ash-window bridges
# its raw window handle to an ash SurfaceKHR.
[target.'cfg(target_os = "windows")'.dev-dependencies]
winit = "0.30"
ash-window = "0.13"
raw-window-handle = "0.6"
winapi = { version = "0.3", features = ["memoryapi", "winbase", "winnt", "handleapi"] }
