# Flatpak manifest for Rivulet.
#
# Divergences from the upstream examples on purpose:
#  - buildsystem is "simple" with explicit cargo invocations instead of the
#    cargo module from flatpak-builder-tools so that cargo stays fully offline
#    (CARGO_NET_OFFLINE) and reproducible from the pinned crate archives.
#  - The crate archives are generated by the official flatpak-cargo-generator
#    (pinned commit, see generate-cargo-sources.sh) and are re-checked against
#    Cargo.lock in CI (flatpak-build.yml drift step); cargo-sources.json is
#    consumed as merged flatpak sources exactly the way a Flathub transparent
#    build would (URL + SHA-256, extracted to cargo/vendor/...).
id: org.rivulet.Rivulet
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rivulet-gui

finish-args:
  # Screen/audio capture (GStreamer + PipeWire), camera passthrough and DRM
  # (Vulkan/OpenGL) output.
  - --device=all
  # Wayland and X11 windows.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Outgoing network connections: Twitch/YouTube ingest, obs-websocket,
  # update checks and the opt-in telemetry/announce endpoint.
  - --share=network
  # Audio playback for the stream preview deck.
  - --socket=pulseaudio
  - --socket=pipewire
  # Recording files, config and resources live under $HOME.
  - --filesystem=home
  # Desktop portals.
  - --talk-name=org.freedesktop.portal.*
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: rivulet
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rivulet/cargo-home
        CARGO_NET_OFFLINE: 'true'
        CARGO_TERM_COLOR: never
        RUSTFLAGS: -C link-arg=-fuse-ld=mold
    build-commands:
      - mkdir -p .cargo
      - cp -v packaging/flatpak/cargo/config.toml .cargo/config.toml
      - cargo --offline fetch --locked
      - cargo build --offline --release --locked
      - install -Dm0755 target/${FLATPAK_ARCH}-unknown-linux-gnu/release/rivulet-gui ${FLATPAK_DEST}/bin/rivulet-gui
      - install -Dm0644 packaging/flatpak/org.rivulet.Rivulet.desktop ${FLATPAK_DEST}/share/applications/org.rivulet.Rivulet.desktop
      - install -Dm0644 packaging/flatpak/org.rivulet.Rivulet.metainfo.xml ${FLATPAK_DEST}/share/metainfo/org.rivulet.Rivulet.metainfo.xml
      - install -Dm0644 packaging/rivulet.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/org.rivulet.Rivulet.png
    sources:
      # Crate archives pinned from Cargo.lock by the official
      # flatpak-cargo-generator (URL + SHA-256). flatpak-builder merges this
      # fixture file into the module sources and extracts them to
      # cargo/vendor/..., which the committed cargo/config.toml maps crates-io
      # to (so cargo never touches the network).
      - cargo/cargo-sources.json
      # The whole repository checkout. The flatpak directory, the cargo config
      # and the desktop/metainfo/icon files are part of it.
      - type: dir
        path: ../..