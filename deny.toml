# cargo-deny policy for Rivulet.
# Keep this file intentionally explicit so dependency-policy changes are reviewed.

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# RUSTSEC-2026-0543 (published 2026-11-17) marks `chrono` unmaintained and offers
# no fixed release: "No safe upgrade is available". `chrono` is a direct
# dependency of `rivulet-core` and `rivulet-gui`, so the `workspace` rule failed
# `Cargo Deny` - and with it the required `Security` check - on every branch from
# that day on. The entry is deliberately narrow: it names one advisory, so a new
# `chrono` advisory still fails, and it disappears with the migration to `time`
# recorded in `docs/security.md`.
ignore = ["RUSTSEC-2026-0543"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
