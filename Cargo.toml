[workspace]
members = [
    "rivulet-core",
    "rivulet-gui",
    "rivulet-capture",
    "rivulet-audio",
    "rivulet-streaming",
    "rivulet-plugins",
    "rivulet-obs-compat",
    "rivulet-updater",
    "rivulet-vulkan-layer",
    "rivulet-opengl-hook-dll",
    "rivulet-launcher",
    "rivulet-obs-websocket"
]
resolver = "2"

[workspace.package]
version = "0.65.0-alpha.104"
authors = ["thoser666"]
edition = "2021"
repository = "https://github.com/thoser666/rivulet"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
xcap = "=0.9.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true