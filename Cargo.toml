[workspace]
members = [
    "rivulet-core",
    "rivulet-gui",
    "rivulet-capture",
    "rivulet-audio",
    "rivulet-plugins",
    "rivulet-obs-compat",
    "rivulet-updater",
    "rivulet-vulkan-layer",
    "rivulet-opengl-hook-dll",
    "rivulet-launcher",
    "rivulet-obs-websocket",
    "rivulet-cli",
    "rivulet-browser"
]
# The fuzz crate builds with libFuzzer's sanitizer runtime and is driven by
# cargo-fuzz (see fuzz/ + scripts/fuzz-smoke.sh); it must stay out of the
# normal workspace build/test/clippy paths.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.65.0-alpha.309"
authors = ["thoser666"]
edition = "2021"
repository = "https://github.com/thoser666/rivulet"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
xcap = "=0.9.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
# wasmtime's DEFAULT feature set turns on its on-disk compilation cache, which
# pulls `wasmtime-internal-cache` -> `zstd 0.13.x` into the dependency tree.
# Every zstd release that requirement accepts is affected by the RustSec
# advisories RUSTSEC-2026-0391 (zstd), -0398/-0403 (zstd-safe) and -0410
# (zstd-sys), which need zstd >= 0.14.3 / zstd-safe >= 8.2.0 / zstd-sys >=
# 2.1.2. There is no upgrade path: wasmtime-internal-cache pins
# `zstd = "^0.13.0"` in every published release (49.0.0 through 50.0.0), so
# cargo cannot select a fixed zstd. The plugin sandbox never uses the module
# cache API, so the feature is dropped instead of silencing the advisory with
# an ignore entry (see docs/security.md). The list below is wasmtime 49's
# default feature set WITHOUT `cache` - every other default stays enabled, so
# plugin runtime behaviour is unchanged.
wasmtime = { version = "49.0", default-features = false, features = [
    "anyhow",
    "async",
    "backtrace",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "component-model-async",
    "threads",
    "stack-switching",
    "std",
    "debug",
    "compile-time-builtins",
    "wit-parser",
] }
wasmtime-wasi = "49.0"

[profile.release]
# Release build settings. Debug info is deliberately PRESERVED (no `strip`, no
# `install -s`, no `-C debuginfo=0`): RUSTFLAGS-requested debug info (-C
# debuginfo) flows through to the artifacts, satisfying the OpenSSF silver
# `build_preserve_debug` criterion. See docs/security/assurance-case.md.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true