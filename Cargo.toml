[workspace]
members = [
    "rivulet-core",
    "rivulet-gui",
    "rivulet-capture",
    "rivulet-audio",
    "rivulet-plugins",
    "rivulet-obs-compat",
    "rivulet-updater",
    "rivulet-vulkan-layer",
    "rivulet-opengl-hook-dll",
    "rivulet-launcher",
    "rivulet-obs-websocket"
]
# The fuzz crate builds with libFuzzer's sanitizer runtime and is driven by
# cargo-fuzz (see fuzz/ + scripts/fuzz-smoke.sh); it must stay out of the
# normal workspace build/test/clippy paths.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.65.0-alpha.139"
authors = ["thoser666"]
edition = "2021"
repository = "https://github.com/thoser666/rivulet"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0"
xcap = "=0.9.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[profile.release]
# Release build settings. Debug info is deliberately PRESERVED (no `strip`, no
# `install -s`, no `-C debuginfo=0`): RUSTFLAGS-requested debug info (-C
# debuginfo) flows through to the artifacts, satisfying the OpenSSF silver
# `build_preserve_debug` criterion. See docs/security/assurance-case.md.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true