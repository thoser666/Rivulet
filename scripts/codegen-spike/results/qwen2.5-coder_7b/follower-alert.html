<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Follower Alert</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #rivuletAlert {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #8e44ad, #9b59b6);
      color: white;
      font-size: 16px;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      opacity: 0;
      transform: translateY(-100%);
      transition: opacity 0.3s, transform 0.3s;
    }
    #rivuletAlert.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div id="rivuletAlert"></div>
  <script>
    function rivuletAlert(name) {
      const alertBox = document.getElementById('rivuletAlert');
      alertBox.textContent = `New follower: ${name}`;
      alertBox.classList.add('show');
      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 4000);
    }

    // Demo alert after 1 second
    setTimeout(() => {
      rivuletAlert('John Doe');
    }, 1000);
  </script>
</body>
</html>
