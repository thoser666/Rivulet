<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Goal Bar</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #goalBar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 50px;
      background: rgba(0, 0, 0, 0.7);
      border-radius: 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      font-family: Arial, sans-serif;
      color: #fff;
    }
    #goalBar .progress {
      height: 100%;
      width: 0;
      background: linear-gradient(to right, #4caf50, #ffc107);
      border-radius: 25px;
    }
  </style>
</head>
<body>
  <div id="goalBar">
    <span id="goalText">Goal: 130 / 250 EUR</span>
    <div id="progress" class="progress"></div>
  </div>
  <script>
    window.rivuletGoal = function(raised, target) {
      const goalText = document.getElementById('goalText');
      const progress = document.getElementById('progress');
      const progressWidth = (raised / target) * 100;
      goalText.textContent = `Goal: ${raised} / ${target} EUR`;
      progress.style.width = `${progressWidth}%`;
    };
  </script>
</body>
</html>
