<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donation Goal Bar</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      height: 100vh;
    }
    #goal-bar {
      position: absolute;
      bottom: 20px;
      width: 600px;
      height: 50px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 25px;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
      display: flex;
      align-items: center;
      padding: 0 20px;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #goal-text {
      flex: 1;
      text-align: center;
    }
    #goal-progress {
      width: 100%;
      height: 10px;
      background: linear-gradient(to right, green, gold);
      border-radius: 5px;
      overflow: hidden;
      position: relative;
      margin-top: 10px;
    }
    #goal-fill {
      height: 100%;
      background: linear-gradient(to right, green, gold);
      border-radius: 5px;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>
  <div id="goal-bar">
    <div id="goal-text">Goal: <span id="raised">130</span> / <span id="target">250</span> EUR</div>
    <div id="goal-progress">
      <div id="goal-fill" style="width: 52%;"></div>
    </div>
  </div>
  <script>
    function rivuletGoal(raised, target) {
      const raisedElem = document.getElementById('raised');
      const targetElem = document.getElementById('target');
      const fillElem = document.getElementById('goal-fill');
      const percentage = (raised / target) * 100;
      raisedElem.textContent = raised;
      targetElem.textContent = target;
      fillElem.style.width = percentage + '%';
    }
    // Initial call to set the starting values
    rivuletGoal(130, 250);
  </script>
</body>
</html>
