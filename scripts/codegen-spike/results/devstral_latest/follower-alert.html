<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Follower Alert</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: transparent;
  }
  #alert {
    position: fixed;
    top: 10px;
    right: 10px;
    padding: 10px 20px;
    border-radius: 5px;
    background: linear-gradient(135deg, #9c27b0, #3f51b5);
    color: white;
    font-size: 16px;
    font-weight: bold;
    opacity: 0;
    transform: translateY(-20px) scale(0.8);
    transition: opacity 0.3s ease-out, transform 0.3s ease-out;
    z-index: 1000;
    pointer-events: none;
  }
  #alert.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
</style>
</head>
<body>
<div id="alert"></div>

<script>
  function rivuletAlert(name) {
    const alertBox = document.getElementById('alert');
    alertBox.textContent = `New follower: ${name}`;
    alertBox.classList.add('visible');
    setTimeout(() => {
      alertBox.classList.remove('visible');
    }, 4000);
  }

  // Demo alert after 1 second
  setTimeout(() => {
    rivuletAlert('DemoUser');
  }, 1000);
</script>
</body>
</html>
